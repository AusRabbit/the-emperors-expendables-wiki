 "group": "Places", "type": "place", "typeLabel": "Place", "dek": "The station where the Empire staged a pirate raid to bury a massacre.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The target of Mission 01. The official story was a pirate raid: the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a> crashed into the station, and the prisoners aboard were meant to recover data, erase evidence and remove witnesses while that story held.</p><p>What the crew found instead was proof of an Imperial massacre, carried by <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> and <a class=\"wl\" href=\"#rusk\">Rusk</a>. They also learned the truth about their own <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars.</p><p>Places the crew passed through:</p><ul><li><a class=\"wl\" href=\"#communications-control\">Communications Control</a> — where they found the <a class=\"wl\" href=\"#vannix-evidence\">evidence</a>.</li><li><a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> — the hostage standoff and the ceasefire.</li><li>The station's spine — a freight-platform ride that ended on top of an Imperial checkpoint.</li><li><a class=\"wl\" href=\"#bay-nine\">Bay Nine</a> — the bribed berth they never quite reached.</li></ul>", "backlinks": ["bay-nine", "black-warrant", "timeline", "communications-control", "cresh-spike", "eleena-daru", "elo-kesh", "galdrek-voss", "kalax", "sera-korr", "cassian-vorn", "mournful-credit", "rx-44", "sera", "session-1", "arden-vel", "telsa-brie", "cautious-nikto", "central-computer-core", "detention-vessel", "overview", "penal-program", "vannix-evidence"], "search": "vannix station the station where the empire staged a pirate raid to bury a massacre."}, {"id": "black-warrant", "title": "Black Warrant", "group": "Ships", "type": "ship", "typeLabel": "Ship", "dek": "The Imperial gunship that relays the collars' commands.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>An Imperial gunship that approached <a class=\"wl\" href=\"#vannix-station\">Vannix</a> during Mission 01, and the true command relay for the <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars. For a moment it identified all five collar-bearers; then <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> forced its telemetry lock into a false maintenance loop and began redirecting it to the wrong part of the station. The trace was reset, not solved.</p><p>It turned out not to matter: the final response that caught the crew near <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a> fired without any help from the gunship.</p>", "backlinks": ["timeline", "cresh-spike", "kalax", "session-1", "telsa-brie", "central-computer-core"], "search": "black warrant the imperial gunship that relays the collars' commands."}, {"id": "mournful-credit", "title": "Mournful Credit", "group": "Ships", "type": "ship", "typeLabel": "Ship", "dek": "The freighter staged as a pirate raider. Crashed and burned.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The freighter <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> used to put the crew into <a class=\"wl\" href=\"#vannix-station\">Vannix</a>, staged so the crash would read as a pirate raid. It burned in the wreck and no longer exists.</p>", "backlinks": ["timeline", "kalax", "cassian-vorn", "session-1", "cautious-nikto", "overview", "vannix-station"], "search": "mournful credit the freighter staged as a pirate raider. crashed and burned."}, {"id": "sure-thing", "title": "Sure Thing", "group": "Ships", "type": "ship", "typeLabel": "Ship", "dek": "Vesh's Z-95 Headhunter. Long gone.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Z-95-AF4 Headhunter, <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s signature fighter, armed with linked medium laser cannons and a concussion missile launcher. <a class=\"wl\" href=\"#kordyne\">Kordyne</a> reassigned or impounded it long before this campaign, and it is a sore point. It may turn up again one day.</p>", "backlinks": ["kordyne", "vesh-talorr"], "search": "sure thing vesh's z-95 headhunter. long gone."}, {"id": "cresh-spike", "title": "Cresh Spike", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "The collars. ISB restraint tech with a sealed final response.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["The collars"], "html": "<p>The collars every member of the crew wears. What they are came out on <a class=\"wl\" href=\"#vannix-station\">Vannix</a>, through <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>'s digging.</p><h2>What They Do</h2><p>Cresh Spike is an ISB-modified prisoner-restraint system: tracking, forced compliance, remote stun, and a sealed \"final response\". The collars are batch-linked to a remote command structure. A station like Vannix can mirror and route their traffic, but cannot remove or control them.</p><p>A maintenance handshake can forge a limited status update or interfere with future synchronisation. It cannot take a collar off.</p><h2>The Relay</h2><p>The true command relay during Mission 01 was the gunship <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a>, whose trace <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> looped. It made no difference: at the threshold of <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>, the final response dropped all five collar-bearers at once, independent of any local trace, console or the gunship. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> holds the authority behind it, and carries a collar-control cylinder.</p><h2>What the Crew Have Noticed</h2><ul><li><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>, during the fitting: a magnetic latch, a receiver node at the nape, and a recessed technician's service port.</li><li><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>: a batch-synchronisation window in how the collars are handled — a possible weakness in the procedure.</li></ul><p>Where the root controller is, and whether the final response can be blocked or reversed, are still <a class=\"wl\" href=\"#threads\">open questions</a>.</p>", "backlinks": ["bay-nine", "black-warrant", "timeline", "kenno-thorn", "cassian-vorn", "threads", "session-1", "telsa-brie", "overview", "penal-program", "vannix-station", "vesh-talorr"], "search": "cresh spike the collars the collars. isb restraint tech with a sealed final response."}, {"id": "code-cylinder", "title": "The Code Cylinder", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "Eleena's officer-grade Imperial code cylinder.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>An officer-grade Imperial code cylinder carried by <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>. She kept it concealed for a long time, then showed it to <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>, then used it openly to force a lockdown bulkhead during the escape toward <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>.</p><p><a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a> knows it exists. Whether it survived the capture hasn't been settled.</p>", "backlinks": ["timeline", "eleena-daru", "elo-kesh", "threads", "session-1"], "search": "the code cylinder eleena's officer-grade imperial code cylinder."}, {"id": "forged-permits", "title": "The Forged Permits", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "Surveying and outfitter papers. One set didn't hold.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>Forged surveying and outfitter permits supplied for the crew's cover on <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>. They passed a bored customs check at <a class=\"wl\" href=\"#redfall-station\">Redfall</a>, but an ID sweep at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> flagged <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s set as inconsistent with the spaceport manifest. The officer who took them did not survive the brawl. Nobody checked <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s or <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s.</p>", "backlinks": ["timeline", "eleena-daru", "threads", "redfall-station", "session-2", "id-sweep-officers"], "search": "the forged permits surveying and outfitter papers. one set didn't hold."}, {"id": "vannix-evidence", "title": "The Vannix Evidence", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "Proof that the Vannix pirate raid was a cover for a massacre.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>Proof of an Imperial massacre on <a class=\"wl\" href=\"#vannix-station\">Vannix</a> — the thing the \"pirate raid\" was staged to bury. <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> and <a class=\"wl\" href=\"#rusk\">Rusk</a> were transmitting it off-station when the crew froze the transmission at 91%. <a class=\"wl\" href=\"#rusk\">Rusk</a> kept the cleanest copy.</p><p>The crew got clear of the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> with the evidence. At the debrief, <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> asked whether it survived; the crew said nothing, and he took the silence as a yes. He said he'd assume someone is carrying it, and that he would come back to the matter \"later, and less politely\".</p><p>Its status since the capture hasn't been settled at the table.</p>", "backlinks": ["timeline", "cassian-vorn", "threads", "rusk", "session-1", "session-2", "telsa-brie", "vannix-station"], "search": "the vannix evidence proof that the vannix pirate raid was a cover for a massacre."}, {"id": "kordyne", "title": "Kordyne Security Solutions", "group": "Factions", "type": "faction", "typeLabel": "Faction", "dek": "Vesh's contractor. Holds his debt; took his ship.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The security contractor that holds <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s contract and his debt. It reassigned or impounded his fighter, the <a class=\"wl\" href=\"#sure-thing\">Sure Thing</a>, well before this campaign.</p>", "backlinks": ["sure-thing", "overview", "vesh-talorr"], "search": "kordyne security solutions vesh's contractor. holds his debt; took his ship."}, {"id": "cathals-reach-garrison", "title": "The Cathal's Reach Garrison", "group": "Factions", "type": "faction", "typeLabel": "Faction", "dek": "Imperial Army. Unusually loyal, because of one man.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The Imperial Army garrison on <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>, commanded by <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> with <a class=\"wl\" href=\"#ilse-wove\">Wove</a> as his second and <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> as the NCO who holds the ranks together. Loyalty is high and desertion low, and the reason is Rennick's refusal to massacre the town. That loyalty to him personally is the biggest obstacle to the crew's mission.</p><p>Its off-duty troopers drink with the locals at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>. After <a class=\"wl\" href=\"#session-3\">Session 3 — The Cantina Breaks</a>, two Imperial officers are dead and the crew are the ones being looked for.</p>", "backlinks": ["cathals-reach", "bant-corrl", "redfall-cantina"], "search": "the cathal's reach garrison imperial army. unusually loyal, because of one man."}, {"id": "penal-program", "title": "The Imperial Penal Black-Ops Program", "group": "Factions", "type": "faction", "typeLabel": "Faction", "dek": "Collared prisoners, used as deniable Imperial assets.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["The Emperor's Dirty Dozen"], "html": "<p>The programme that owns the crew. Prisoners are fitted with <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars and deployed on missions the Empire cannot be seen to run, under handlers like <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>. Unofficially, its assets are known as the Emperor's Dirty Dozen.</p><p>So far it has sent the crew to <a class=\"wl\" href=\"#vannix-station\">Vannix</a> and to <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>.</p>", "backlinks": ["overview"], "search": "the imperial penal black-ops program the emperor's dirty dozen collared prisoners, used as deniable imperial assets."}];
const TITLES = {"arden-vel": "Station Chief Arden Vel", "bant-corrl": "Master Sergeant Bant Corrl", "bay-nine": "Bay Nine", "black-warrant": "Black Warrant", "cassian-vorn": "Major Cassian Vorn", "cathals-reach-garrison": "The Cathal's Reach Garrison", "cathals-reach": "Cathal's Reach", "cautious-nikto": "The Cautious Nikto", "central-computer-core": "The Central Computer Core", "code-cylinder": "The Code Cylinder", "communications-control": "Communications Control", "cresh-spike": "Cresh Spike", "detention-vessel": "The Detention Vessel", "doran-rennick": "Colonel Doran Rennick", "eleena-daru": "Eleena Daru", "elo-kesh": "Elo Kesh", "forged-permits": "The Forged Permits", "galdrek-voss": "Galdrek Voss", "id-sweep-officers": "The ID-Sweep Officers", "ilse-wove": "Captain Ilse Wove", "kalax": "Kalax", "kenno-thorn": "Kennaud \"Kenno\" Thorn", "kordyne": "Kordyne Security Solutions", "loggers-house": "The Logger's House", "lysa-venn": "Sergeant Lysa Venn", "marn-oshel": "Marn Oshel", "mournful-credit": "Mournful Credit", "overview": "The Emperor's Expendables", "penal-program": "The Imperial Penal Black-Ops Program", "redfall-cantina": "The Redfall Cantina", "redfall-station": "Redfall Station", "rusk": "R6-K4 \"Rusk\"", "rx-44": "RX-44 \"Rex\"", "sera-korr": "Lieutenant Sera Korr", "sera": "Sera (Kalax's Enforcer)", "session-1": "Session 1 — No Survivors on Vannix Station", "session-2": "Session 2 — The Rennick Run", "session-3": "Session 3 — The Cantina Breaks", "sure-thing": "Sure Thing", "telsa-brie": "Telsa Brie", "threads": "Open Threads", "timeline": "Campaign Timeline", "vannix-evidence": "The Vannix Evidence", "vannix-station": "Vannix Station", "vesh-talorr": "Vesh Talorr"};
const BUILT  = "2026-09-26";
const CAMPAIGN = "The Emperor's Expendables";
const SOURCE_NOTE = "Sessions 1–3 were compiled from the campaign ledger rather than a recording, and hold only what the party learned at the table — no GM secrets. Later sessions will come from Craig recordings transcribed with <code>faster-whisper</code>.";
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
let current = PAGES.length ? PAGES[0].id : "";

const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const q    = document.getElementById("q");

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + p.title + '</h1>';
  if(p.dek) h += '<div class="dek">' + p.dek + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aka && p.aka.length){
      h += '<div class="panel"><div class="ph">Also known as</div><div>'
         + p.aka.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  h += '<div class="prose">' + p.html + '</div>';

  if(p.backlinks.length){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + TITLES[b] + '</a></li>').join('')
       + '</ul></div>';
  }

  h += '<div class="foot">' + SOURCE_NOTE + ' Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + p.title + '</span>'
        + (p.type !== "doc" && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : '')
        + '</a>').join('')
    + '</div>').join('');
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  nav.innerHTML = renderNav(q.value);
  document.title = (byId[current] ? byId[current].title + " · " : "") + CAMPAIGN;
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("wd-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("wd-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
</body>
</html>
