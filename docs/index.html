ef=\"#sera\">Sera</a>, <a class=\"wl\" href=\"#kalax\">Kalax</a>'s enforcer, but is a different person entirely.</p><p>She has no part in the current arc.</p>", "backlinks": ["sera"], "search": "lieutenant sera korr a wounded imperial security officer. not kalax's sera."}, {"id": "rusk", "title": "R6-K4 \"Rusk\"", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "A damaged astromech carrying the cleanest copy of the truth.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["R6-K4"], "html": "<p>A battered astromech working with <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> in <a class=\"wl\" href=\"#communications-control\">Communications Control</a>. When the crew froze the outgoing transmission, Rusk kept the cleanest copy of the <a class=\"wl\" href=\"#vannix-evidence\">massacre evidence</a> — \"the one they didn't touch\", as <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> put it.</p><p>Too damaged to move itself, it was dragged to the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> on a strip of insulation mat, offering the occasional broken chirp. Its whereabouts and condition since then are unknown. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> asked about it by name.</p>", "backlinks": ["timeline", "communications-control", "threads", "session-1", "session-2", "telsa-brie", "vannix-evidence", "vannix-station"], "search": "r6-k4 \"rusk\" r6-k4 a damaged astromech carrying the cleanest copy of the truth."}, {"id": "sera", "title": "Sera (Kalax's Enforcer)", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "Kalax's partner. Drew on Eleena to keep Telsa alive.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A collared prisoner, chain-fighter, and <a class=\"wl\" href=\"#kalax\">Kalax</a>'s enforcer and partner. Not to be confused with <a class=\"wl\" href=\"#sera-korr\">Sera Korr</a>, an Imperial officer on <a class=\"wl\" href=\"#vannix-station\">Vannix</a>.</p><p>She went for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> in the wreck of the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a>, and <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> destroyed her improvised weapon. She and <a class=\"wl\" href=\"#kalax\">Kalax</a> got away, then locked the crew out at a sealed service iris.</p><p>In the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> she argued that <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> had kept the loop alive when she could have sold them all out. When <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> moved to execute <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> anyway, Sera caught it and levelled her weapon at <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>: <em>\"Don't.\"</em> When <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> insulted her in front of <a class=\"wl\" href=\"#kalax\">Kalax</a>, she stared him down too. She is <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s enemy now.</p><p>The crew blamed her alongside <a class=\"wl\" href=\"#kalax\">Kalax</a> at the debrief. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> read her as a loyalist who protects whoever she has decided is worth protecting. Her fate is unconfirmed.</p>", "backlinks": ["timeline", "eleena-daru", "kalax", "sera-korr", "threads", "session-1", "session-2", "telsa-brie", "cautious-nikto", "central-computer-core"], "search": "sera (kalax's enforcer) kalax's partner. drew on eleena to keep telsa alive."}, {"id": "arden-vel", "title": "Station Chief Arden Vel", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "Vannix's station chief, and a whistleblower of his own.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The chief of <a class=\"wl\" href=\"#vannix-station\">Vannix</a>. After the killings started, he authorised getting the <a class=\"wl\" href=\"#vannix-evidence\">evidence</a> off the station, and his aide had already made contact with a Rebel relay cell.</p><p>The crew found him in the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a>: middle-aged, in a stained grey uniform, one eye swollen nearly shut, a holdout blaster in his hand, with two security survivors holding the lower doors. Through him, <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> got provisional access to the Core. The confrontation there turned violent and he was incapacitated.</p><p>His status since the crew left the Core is unknown.</p>", "backlinks": ["timeline", "threads", "session-1", "telsa-brie", "central-computer-core", "vannix-evidence"], "search": "station chief arden vel vannix's station chief, and a whistleblower of his own."}, {"id": "telsa-brie", "title": "Telsa Brie", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "The Mirialan technician who tried to get the truth off Vannix. Fate unknown.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Mirialan junior communications technician on <a class=\"wl\" href=\"#vannix-station\">Vannix</a>. When the crew found her in <a class=\"wl\" href=\"#communications-control\">Communications Control</a>, she and <a class=\"wl\" href=\"#rusk\">Rusk</a> were trying to transmit proof of an Imperial massacre off the station. The crew froze the transmission at 91%.</p><p>After that she became the crew's guide, because they were her best chance of keeping the <a class=\"wl\" href=\"#vannix-evidence\">evidence</a> alive. In a side alcove she told them what <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> really is, what the archive held, and that Station Chief <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a> had authorised the transmission after the killings started — his aide had already contacted a Rebel relay cell. <em>\"I don't care what uniform they wear. They were the only ones outside Imperial command who might listen.\"</em></p><p>She tried one diagnostic on <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s collar. It failed painfully, but it showed her the collars are batch-synced to a command node that might, with the right console and keys, be fooled. She pointed the crew at the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a>, more certain in her words than in her hands, and led them there.</p><p>In the Core she was taken hostage by <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>, still forced the <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a>'s lock into a false loop, and offered to hide the crew and misdirect the gunship — <em>\"But I will not walk willingly into a prison ship.\"</em> Then <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> moved behind her to kill her, and <a class=\"wl\" href=\"#sera\">Sera</a> drew on <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> to stop it. How that standoff ended was never played out.</p><p>At the debrief <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> asked about her directly, and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s \"Who's Telsa?\" did not fool him. Her whereabouts are unknown.</p>", "backlinks": ["black-warrant", "timeline", "communications-control", "cresh-spike", "eleena-daru", "kalax", "kenno-thorn", "cassian-vorn", "threads", "rusk", "sera", "session-1", "session-2", "arden-vel", "central-computer-core", "code-cylinder", "vannix-evidence", "vannix-station", "vesh-talorr"], "search": "telsa brie the mirialan technician who tried to get the truth off vannix. fate unknown."}, {"id": "cautious-nikto", "title": "The Cautious Nikto", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "Kalax's gunman. Didn't make it out of the wreck.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": ["The Nikto gunman"], "html": "<p>A Nikto gunman, one of <a class=\"wl\" href=\"#kalax\">Kalax</a>'s two associates alongside <a class=\"wl\" href=\"#sera\">Sera</a>, and part of the competing team <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> sent into <a class=\"wl\" href=\"#vannix-station\">Vannix</a>.</p><p>When <a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew went for their weapons in the wreck of the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a>, <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> took the fight out of him, and <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s frag grenade killed him — taking some of the false-flag staging material with him. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> kept his pirate pistol.</p><p>Deceased.</p>", "backlinks": ["timeline", "eleena-daru", "kalax", "kenno-thorn", "session-1"], "search": "the cautious nikto the nikto gunman kalax's gunman. didn't make it out of the wreck."}, {"id": "elo-kesh", "title": "Elo Kesh", "group": "Before Vannix", "type": "character", "typeLabel": "Character", "dek": "A cage-market broker who knows more than he should.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A broker and information contact the crew met in custody at <a class=\"wl\" href=\"#annex-17\">Annex 17</a>, around the Cage Market.</p><p>He knows <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> carries a <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a>, and he knew <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s full name, which <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> did not expect. He has no part in the current arc, but what he knows could make him useful leverage one day.</p>", "backlinks": ["timeline", "eleena-daru", "kenno-thorn", "threads", "annex-17", "session-1", "code-cylinder"], "search": "elo kesh a cage-market broker who knows more than he should."}, {"id": "rx-44", "title": "RX-44 \"Rex\"", "group": "Before Vannix", "type": "character", "typeLabel": "Character", "dek": "A damaged security droid from the prison days.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["RX-44"], "html": "<p>A damaged security droid from the crew's original prison, before <a class=\"wl\" href=\"#vannix-station\">Vannix</a>.</p><p>It has no part in the current arc.</p>", "backlinks": [], "search": "rx-44 \"rex\" rx-44 a damaged security droid from the prison days."}, {"id": "lysa-venn", "title": "Sergeant Lysa Venn", "group": "Before Vannix", "type": "character", "typeLabel": "Character", "dek": "The detention authority at the crew's intake.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The detention authority who oversaw the crew's original intake at <a class=\"wl\" href=\"#annex-17\">Annex 17</a>, before they were collared and handed to <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>.</p><p>She has no part in the current arc.</p>", "backlinks": ["annex-17"], "search": "sergeant lysa venn the detention authority at the crew's intake."}, {"id": "bay-nine", "title": "Bay Nine", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "The bribe berth that should have been the way out.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>An unregistered service berth on <a class=\"wl\" href=\"#vannix-station\">Vannix</a>, kept for contractor crews who would rather not appear on the Imperial manifest. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> knew the type: low deck, aft, near the reclamation plant, with no transponder logging and an older docking-clamp control that doesn't answer to the central lockdown.</p><p>The crew got within sight of its corridor, in a cargo bay at the top of a maintenance ladder, before the <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> final response dropped all three.</p>", "backlinks": ["black-warrant", "timeline", "cresh-spike", "eleena-daru", "cassian-vorn", "session-1", "code-cylinder", "overview", "vannix-station", "vesh-talorr"], "search": "bay nine the bribe berth that should have been the way out."}, {"id": "cathals-reach", "title": "Cathal's Reach", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "An occupied world that isn't afraid. That's the problem.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>An Imperial-garrisoned world of timber, logging and backcountry, held by the <a class=\"wl\" href=\"#cathals-reach-garrison\">Cathal's Reach garrison</a> under <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>. It is the setting of Mission 02.</p><p>The locals aren't happy about the occupation, but they aren't terrorised by it either — they treat it more like weather than war. People here credit that peace to <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>, and that peace is exactly why Command wants him dead.</p><p>The crew are based at <a class=\"wl\" href=\"#redfall-station\">Redfall</a>.</p>", "backlinks": ["ilse-wove", "doran-rennick", "cassian-vorn", "redfall-station", "session-2", "cathals-reach-garrison", "overview", "forged-permits", "penal-program"], "search": "cathal's reach an occupied world that isn't afraid. that's the problem."}, {"id": "communications-control", "title": "Communications Control", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Where the evidence was caught at 91%.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The communications hub of <a class=\"wl\" href=\"#vannix-station\">Vannix</a>. The crew went for communications before the archives, and found <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> and <a class=\"wl\" href=\"#rusk\">Rusk</a> part-way through transmitting proof of a massacre off the station. The crew froze the transmission at 91%, and <a class=\"wl\" href=\"#rusk\">Rusk</a> kept the cleanest copy. A security-droid response drove everyone out onto an emergency route.</p>", "backlinks": ["rusk", "session-1", "telsa-brie", "vannix-station"], "search": "communications control where the evidence was caught at 91%."}, {"id": "annex-17", "title": "Penal Processing Annex 17", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Where the crew's story began: Imperial custody, and the Cage Market.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The Imperial penal processing facility where <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> began in custody, and where the crew's intake was overseen by <a class=\"wl\" href=\"#lysa-venn\">Sergeant Lysa Venn</a>.</p><p>A failed escape attempt, and a vicious fight in the Cage Market against <a class=\"wl\" href=\"#kalax\">Kalax</a> and his two associates, marked the pair as dangerous prospects rather than ordinary prisoners. The broker <a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a> worked the Cage Market, and <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> kept a stolen <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a> hidden on her the whole time.</p><p>From here, the crew — now including <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> — were collared with <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a>, interrogated, and handed to <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>.</p>", "backlinks": ["timeline", "eleena-daru", "elo-kesh", "kalax", "kenno-thorn", "lysa-venn", "session-1", "code-cylinder", "overview", "penal-program"], "search": "penal processing annex 17 where the crew's story began: imperial custody, and the cage market."}, {"id": "redfall-station", "title": "Redfall Station", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Spaceport and timber town. The crew's cover lasted one night here.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The spaceport and logging town on <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a> where the crew landed, posing as an independent surveying, game and timber outfit. Their cover gear is stored in a rented shed near the spaceport.</p><p>On arrival, a bored customs officer barely glanced at their <a class=\"wl\" href=\"#forged-permits\">forged permits</a>, and two off-duty soldiers shared a thermos and a joke nearby — a first glimpse of how unusually calm the place is.</p><p>The calm did not survive the crew. After the brawl at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>, the streets have the hush of a town waiting to see who gets blamed. The crew are lying low in a <a class=\"wl\" href=\"#loggers-house\">logger's house</a> on the edge of town.</p>", "backlinks": ["timeline", "cathals-reach", "eleena-daru", "session-2", "session-3", "overview", "forged-permits", "loggers-house", "redfall-cantina"], "search": "redfall station spaceport and timber town. the crew's cover lasted one night here."}, {"id": "central-computer-core", "title": "The Central Computer Core", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Hostages, a ceasefire, and a standoff nobody saw end.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The heart of <a class=\"wl\" href=\"#vannix-station\">Vannix</a>'s systems: a wide vertical chamber built around a cylindrical data spine rising through three decks of grated catwalks, with blue status light pulsing through transparent conduits and maintenance arms hanging over the core. <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> believed it was the place to try for the collars; she was more sure of that in her words than in her hands.</p><p>The crew came in from the upper maintenance access in stolen station overalls. Below were <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, two security survivors, two utility droids and an idle security droid. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> turned it into a hostage situation. <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, the guards and the security droid went down, and a collapsed gantry buried the last guard and one of the doorways.</p><p>It was here that <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> took the ceasefire, <a class=\"wl\" href=\"#kalax\">Kalax</a> opened the relay panel beneath the core, and <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> looped the <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a>'s trace. It was also here that <a class=\"wl\" href=\"#sera\">Sera</a> drew on <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>. The crew got out with the evidence; how the standoff ended was never played.</p>", "backlinks": ["eleena-daru", "kalax", "rusk", "sera", "session-1", "arden-vel", "telsa-brie", "code-cylinder", "vannix-evidence", "vannix-station"], "search": "the central computer core hostages, a ceasefire, and a standoff nobody saw end."}, {"id": "detention-vessel", "title": "The Detention Vessel", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Where the crew were held after Vannix. Probably a ship. Nobody's confirmed it.", "conf": "lo", "confLabel": "Low confidence", "player": "", "aliases": [], "aka": [], "html": "<p>The crew woke here after <a class=\"wl\" href=\"#vannix-station\">Vannix</a>: cells along a narrow curved corridor, no windows, no chrono, and a deep thrum in the deck that never stopped. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> felt the floor lean, and a distant groan made a guard's eyes flick away like he had heard it before. The guards had been running silent for days.</p><p>The crew suspect it is a ship in transit. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> asked whether they knew where they were; they gave him nothing, and he didn't say. It has no name on record — the title here is a placeholder.</p><p>The debrief and the Mission 02 orders both happened here.</p>", "backlinks": ["timeline", "threads", "session-2"], "search": "the detention vessel where the crew were held after vannix. probably a ship. nobody's confirmed it."}, {"id": "loggers-house", "title": "The Logger's House", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "A borrowed refuge on the edge of town, with a captain at the door.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>A borrowed logger's house at the edge of <a class=\"wl\" href=\"#redfall-station\">Redfall</a>, where the crew went to ground after the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> brawl. It smells of woodsmoke and the antiseptic of the night's field dressing. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> is recovering by the hearth.</p><p>In grey morning light, <a class=\"wl\" href=\"#ilse-wove\">Wove</a> is standing outside the front door with two troopers, asking for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>.</p>", "backlinks": ["timeline", "ilse-wove", "eleena-daru", "threads", "redfall-station", "session-3", "overview", "vesh-talorr"], "search": "the logger's house a borrowed refuge on the edge of town, with a captain at the door."}, {"id": "redfall-cantina", "title": "The Redfall Cantina", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Warm, loud, unafraid of itself — until the crew came in. Now wrecked.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>The cantina at <a class=\"wl\" href=\"#redfall-station\">Redfall</a>, where off-duty troopers of the <a class=\"wl\" href=\"#cathals-reach-garrison\">Cathal's Reach garrison</a> drank alongside loggers and haulers, a card game ran hot in one corner, and <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> held court at the longest table.</p><p>The bartender was not impressed by <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s generosity, but he told <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> that the town's peace has <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>'s name on it.</p><p>In <a class=\"wl\" href=\"#session-3\">Session 3 — The Cantina Breaks</a> it became a three-sided brawl between the <a class=\"wl\" href=\"#id-sweep-officers\">ID-sweep officers</a> and loyal troopers, anti-Imperial locals, and the crew. Two officers died, <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> went down in the doorway, and the room was wrecked by the time the constabulary arrived.</p>", "backlinks": ["timeline", "ilse-wove", "doran-rennick", "kenno-thorn", "marn-oshel", "bant-corrl", "threads", "redfall-station", "session-2", "session-3", "cathals-reach-garrison", "overview", "forged-permits", "id-sweep-officers", "loggers-house", "vesh-talorr"], "search": "the redfall cantina warm, loud, unafraid of itself — until the crew came in. now wrecked."}, {"id": "vannix-station", "title": "Vannix Station", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "A half-refitted relay station, where the Empire staged a pirate raid to bury a massacre.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["Vannix Relay Station"], "html": "<p>Vannix Relay Station, a refit yard only partly through its refit, and the target of Mission 01. The crew's orders were to recover its central data core, erase its records, stage a pirate attack and leave no witnesses. The pirate story began with the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a> crashing into it.</p><p>What the crew found instead was proof of an Imperial massacre, carried by <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> and <a class=\"wl\" href=\"#rusk\">Rusk</a>, and the truth about their own <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars.</p><p>Places the crew passed through:</p><ul><li>A maintenance collar, where the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a> came to rest, and the service conduits and crawlways beyond it.</li><li><a class=\"wl\" href=\"#communications-control\">Communications Control</a> — where they found the <a class=\"wl\" href=\"#vannix-evidence\">evidence</a>.</li><li><a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> — the hostage standoff and the ceasefire.</li><li>The central spine — its passenger car welded off in the refit, its freight platform still running through a shaft of coolant machinery. The ride ended on top of an Imperial checkpoint.</li><li><a class=\"wl\" href=\"#bay-nine\">Bay Nine</a> — the bribe berth they never quite reached.</li></ul>", "backlinks": ["bay-nine", "black-warrant", "timeline", "communications-control", "cresh-spike", "eleena-daru", "galdrek-voss", "kalax", "sera-korr", "cassian-vorn", "mournful-credit", "rx-44", "sera", "session-1", "arden-vel", "telsa-brie", "cautious-nikto", "central-computer-core", "code-cylinder", "detention-vessel", "overview", "penal-program", "vannix-evidence"], "search": "vannix station vannix relay station a half-refitted relay station, where the empire staged a pirate raid to bury a massacre."}, {"id": "black-warrant", "title": "Black Warrant", "group": "Ships", "type": "ship", "typeLabel": "Ship", "dek": "The Imperial gunship that relays the collars' commands.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>An Imperial gunship that approached <a class=\"wl\" href=\"#vannix-station\">Vannix</a> during Mission 01, and the true command relay for the <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars. For a moment it identified all five collar-bearers; then <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> forced its telemetry lock into a false maintenance loop and began redirecting it to the wrong part of the station. The trace was reset, not solved.</p><p>It turned out not to matter: the final response that caught the crew near <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a> fired without any help from the gunship.</p>", "backlinks": ["timeline", "cresh-spike", "kalax", "session-1", "telsa-brie", "central-computer-core"], "search": "black warrant the imperial gunship that relays the collars' commands."}, {"id": "mournful-credit", "title": "Mournful Credit", "group": "Ships", "type": "ship", "typeLabel": "Ship", "dek": "The unmanned freighter the crew woke up on, aimed at Vannix. Crashed and burned.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>An unmanned freighter, staged as a pirate raider, that <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> used as the crew's insertion into <a class=\"wl\" href=\"#vannix-station\">Vannix</a>. They woke aboard it locked on a collision course with the station's docking arm. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> steered it into a maintenance collar instead, which saved their lives. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> sealed the pressure breach.</p><p>Its damaged transponder completed an automated handshake with the station, which brought security to the crash site. The fight with <a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew, a frag grenade, fire and suppression foam finished it off. It no longer exists.</p>", "backlinks": ["timeline", "eleena-daru", "kalax", "kenno-thorn", "cassian-vorn", "sera", "session-1", "cautious-nikto", "overview", "vannix-station", "vesh-talorr"], "search": "mournful credit the unmanned freighter the crew woke up on, aimed at vannix. crashed and burned."}, {"id": "sure-thing", "title": "Sure Thing", "group": "Ships", "type": "ship", "typeLabel": "Ship", "dek": "Vesh's Z-95 Headhunter. Long gone.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Z-95-AF4 Headhunter, <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s signature fighter, armed with linked medium laser cannons and a concussion missile launcher. <a class=\"wl\" href=\"#kordyne\">Kordyne</a> reassigned or impounded it long before this campaign, and it is a sore point. It may turn up again one day.</p>", "backlinks": ["kordyne", "vesh-talorr"], "search": "sure thing vesh's z-95 headhunter. long gone."}, {"id": "cresh-spike", "title": "Cresh Spike", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "The collars. ISB restraint tech with a sealed final response.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["The collars"], "html": "<p>The collars every member of the crew wears, fitted before they were handed to <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>. What they really are came out on <a class=\"wl\" href=\"#vannix-station\">Vannix</a>, from <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>:</p><p><em>\"Cresh Spike is the restraint system. Collars, implants, remote compliance hardware. Batch-linked. Military prison stock, ISB-modified. It can stun you, drop you, track you, maybe kill you if the calibration is cruel enough.\"</em></p><h2>What They Do</h2><p>Tracking, forced compliance, remote stun, and a sealed \"final response\". The collars are batch-synced to a remote command node. A station like Vannix can mirror and route their traffic, but cannot remove or control them.</p><p>Cutting the wrong line makes a collar think its wearer is escaping custody. <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>'s one diagnostic on <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s collar threw a blue-white arc and slammed him into a wall.</p><h2>The Leads</h2><ul><li>With a calibration station, or a live technician console and officer-level keys, it might be possible to spoof a maintenance cycle — perhaps enough to disable the remote stun. <em>\"Maybe.\"</em></li><li>A maintenance handshake can forge a limited status update or interfere with future synchronisation. It cannot take a collar off.</li><li><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>, during the fitting: a magnetic latch, a receiver node at the nape, and a recessed technician's service port.</li><li><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>: a batch-synchronisation window in how the collars are handled.</li></ul><h2>The Relay</h2><p>The command relay during Mission 01 was the gunship <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a>, whose trace <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> looped. It made no difference: at the threshold of <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>, the final response dropped all five collar-bearers at once, independent of any local trace, console or the gunship. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> holds the authority behind it, and carries a collar-control cylinder.</p><p>Where the root controller is, and whether the final response can be blocked or reversed, are still <a class=\"wl\" href=\"#threads\">open questions</a>.</p>", "backlinks": ["bay-nine", "black-warrant", "timeline", "kenno-thorn", "cassian-vorn", "threads", "annex-17", "session-1", "telsa-brie", "overview", "penal-program", "isb", "vannix-evidence", "vannix-station", "vesh-talorr"], "search": "cresh spike the collars the collars. isb restraint tech with a sealed final response."}, {"id": "code-cylinder", "title": "The Code Cylinder", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "Eleena's stolen, matte-black, officer-grade Imperial code cylinder.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A matte-black, officer-grade Imperial code cylinder that <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> stole and kept hidden on her person through her custody at <a class=\"wl\" href=\"#annex-17\">Annex 17</a>. <a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a> knows it exists.</p><p>On <a class=\"wl\" href=\"#vannix-station\">Vannix</a> she finally produced it — from the slit of her prison smock — to convince <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> the crew could get a restricted console in the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> to accept them. Later she used it openly to force a lockdown bulkhead during the escape toward <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>.</p><p>Whether it survived the capture hasn't been settled.</p>", "backlinks": ["timeline", "eleena-daru", "elo-kesh", "threads", "annex-17", "session-1"], "search": "the code cylinder eleena's stolen, matte-black, officer-grade imperial code cylinder."}, {"id": "forged-permits", "title": "The Forged Permits", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "Surveying and outfitter papers. One set didn't hold.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>Forged surveying and outfitter permits supplied for the crew's cover on <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>. They passed a bored customs check at <a class=\"wl\" href=\"#redfall-station\">Redfall</a>, but an ID sweep at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> flagged <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s set as inconsistent with the spaceport manifest. The officer who took them did not survive the brawl. Nobody checked <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s or <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s.</p>", "backlinks": ["timeline", "eleena-daru", "threads", "redfall-station", "session-2", "id-sweep-officers"], "search": "the forged permits surveying and outfitter papers. one set didn't hold."}, {"id": "vannix-evidence", "title": "The Vannix Evidence", "group": "Things", "type": "thing", "typeLabel": "Item", "dek": "Proof of the Vannix massacre — and of what the collars are for.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The archive <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> and <a class=\"wl\" href=\"#rusk\">Rusk</a> were trying to get off <a class=\"wl\" href=\"#vannix-station\">Vannix</a>. It holds proof of the Imperial killings on the station — the thing the \"pirate raid\" was staged to bury — along with <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> maintenance windows, authentication keys and collar-cart batch-sync data. That is enough to prove prisoners are being used as disposable, deniable assets: the crew's own <a class=\"wl\" href=\"#penal-program\">Penal Black-Ops Program</a>.</p><p>Station Chief <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a> authorised the transmission after the killings started, and his aide had already reached a Rebel relay cell. The crew froze the transmission at 91%. <a class=\"wl\" href=\"#rusk\">Rusk</a> kept the clean copy — \"the one they didn't touch\".</p><p>The crew got clear of the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> with the evidence. At the debrief, <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> asked whether it survived; the crew said nothing, and he took the silence as a yes. He said he would come back to the matter \"later, and less politely\".</p><p>Its status since the capture hasn't been settled at the table.</p>", "backlinks": ["timeline", "cassian-vorn", "threads", "rusk", "session-1", "session-2", "arden-vel", "telsa-brie", "penal-program", "vannix-station"], "search": "the vannix evidence proof of the vannix massacre — and of what the collars are for."}, {"id": "kordyne", "title": "Kordyne Security Solutions", "group": "Factions", "type": "faction", "typeLabel": "Faction", "dek": "Vesh's contractor. Holds his debt; took his ship.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The security contractor that holds <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s contract and his debt. It reassigned or impounded his fighter, the <a class=\"wl\" href=\"#sure-thing\">Sure Thing</a>, well before this campaign.</p>", "backlinks": ["sure-thing", "overview", "vesh-talorr"], "search": "kordyne security solutions vesh's contractor. holds his debt; took his ship."}, {"id": "cathals-reach-garrison", "title": "The Cathal's Reach Garrison", "group": "Factions", "type": "faction", "typeLabel": "Faction", "dek": "Imperial Army. Unusually loyal, because of one man.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The Imperial Army garrison on <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>, commanded by <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> with <a class=\"wl\" href=\"#ilse-wove\">Wove</a> as his second and <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> as the NCO who holds the ranks together. Loyalty is high and desertion low, and the reason is Rennick's refusal to massacre the town. That loyalty to him personally is the biggest obstacle to the crew's mission.</p><p>Its off-duty troopers drink with the locals at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>. After <a class=\"wl\" href=\"#session-3\">Session 3 — The Cantina Breaks</a>, two Imperial officers are dead and the crew are the ones being looked for.</p>", "backlinks": ["cathals-reach", "bant-corrl", "redfall-cantina"], "search": "the cathal's reach garrison imperial army. unusually loyal, because of one man."}, {"id": "penal-program", "title": "The Imperial Penal Black-Ops Program", "group": "Factions", "type": "faction", "typeLabel": "Faction", "dek": "Collared prisoners, used as deniable Imperial assets.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["The Emperor's Dirty Dozen"], "html": "<p>The programme that owns the crew, run by <a class=\"wl\" href=\"#isb\">ISB</a> officers like <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>. Prisoners from places like <a class=\"wl\" href=\"#annex-17\">Annex 17</a> are fitted with <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars and deployed on missions the Empire cannot be seen to run. Rival teams can be sent in together, as <a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew were on Vannix. Unofficially, its assets are known as the Emperor's Dirty Dozen.</p><p>The <a class=\"wl\" href=\"#vannix-evidence\">The Vannix Evidence</a> includes proof that the programme exists.</p><p>So far it has sent the crew to <a class=\"wl\" href=\"#vannix-station\">Vannix</a> and to <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>.</p>", "backlinks": ["threads", "overview", "isb", "vannix-evidence"], "search": "the imperial penal black-ops program the emperor's dirty dozen collared prisoners, used as deniable imperial assets."}, {"id": "isb", "title": "The Imperial Security Bureau", "group": "Factions", "type": "faction", "typeLabel": "Faction", "dek": "The Empire's security service. Vorn's employer; the collars' designer.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["ISB"], "html": "<p>The Empire's internal security and intelligence service. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> is an ISB officer, and his deployment reports are filed under its letterhead. The <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars are military prison stock, ISB-modified.</p><p>The <a class=\"wl\" href=\"#penal-program\">Penal Black-Ops Program</a> that owns the crew runs under its authority.</p>", "backlinks": ["timeline", "cassian-vorn", "session-1", "overview", "penal-program"], "search": "the imperial security bureau isb the empire's security service. vorn's employer; the collars' designer."}];
const TITLES = {"annex-17": "Penal Processing Annex 17", "arden-vel": "Station Chief Arden Vel", "bant-corrl": "Master Sergeant Bant Corrl", "bay-nine": "Bay Nine", "black-warrant": "Black Warrant", "cassian-vorn": "Major Cassian Vorn", "cathals-reach-garrison": "The Cathal's Reach Garrison", "cathals-reach": "Cathal's Reach", "cautious-nikto": "The Cautious Nikto", "central-computer-core": "The Central Computer Core", "code-cylinder": "The Code Cylinder", "communications-control": "Communications Control", "cresh-spike": "Cresh Spike", "detention-vessel": "The Detention Vessel", "doran-rennick": "Colonel Doran Rennick", "eleena-daru": "Eleena Daru", "elo-kesh": "Elo Kesh", "forged-permits": "The Forged Permits", "galdrek-voss": "Galdrek Voss", "id-sweep-officers": "The ID-Sweep Officers", "ilse-wove": "Captain Ilse Wove", "isb": "The Imperial Security Bureau", "kalax": "Kalax", "kenno-thorn": "Kennaud \"Kenno\" Thorn", "kordyne": "Kordyne Security Solutions", "loggers-house": "The Logger's House", "lysa-venn": "Sergeant Lysa Venn", "marn-oshel": "Marn Oshel", "mournful-credit": "Mournful Credit", "overview": "The Emperor's Expendables", "penal-program": "The Imperial Penal Black-Ops Program", "redfall-cantina": "The Redfall Cantina", "redfall-station": "Redfall Station", "rusk": "R6-K4 \"Rusk\"", "rx-44": "RX-44 \"Rex\"", "sera-korr": "Lieutenant Sera Korr", "sera": "Sera (Kalax's Enforcer)", "session-1": "Session 1 — No Survivors on Vannix Station", "session-2": "Session 2 — The Rennick Run", "session-3": "Session 3 — The Cantina Breaks", "sure-thing": "Sure Thing", "telsa-brie": "Telsa Brie", "threads": "Open Threads", "timeline": "Campaign Timeline", "vannix-evidence": "The Vannix Evidence", "vannix-station": "Vannix Station", "vesh-talorr": "Vesh Talorr"};
const BUILT  = "2026-09-26";
const CAMPAIGN = "The Emperor's Expendables";
const SOURCE_NOTE = "Sessions 1–3 were compiled from the campaign ledger and the GM's Discord posts rather than a recording, and hold only what the party learned at the table — no GM secrets. Later sessions will come from Craig recordings transcribed with <code>faster-whisper</code>.";
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
let current = PAGES.length ? PAGES[0].id : "";

const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const q    = document.getElementById("q");

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + p.title + '</h1>';
  if(p.dek) h += '<div class="dek">' + p.dek + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aka && p.aka.length){
      h += '<div class="panel"><div class="ph">Also known as</div><div>'
         + p.aka.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  h += '<div class="prose">' + p.html + '</div>';

  if(p.backlinks.length){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + TITLES[b] + '</a></li>').join('')
       + '</ul></div>';
  }

  h += '<div class="foot">' + SOURCE_NOTE + ' Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + p.title + '</span>'
        + (p.type !== "doc" && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : '')
        + '</a>').join('')
    + '</div>').join('');
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  nav.innerHTML = renderNav(q.value);
  document.title = (byId[current] ? byId[current].title + " · " : "") + CAMPAIGN;
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("wd-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("wd-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
</body>
