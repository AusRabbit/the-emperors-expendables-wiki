<style>
  :root{
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#191D23; --muted:#59636F; --line:#D6DBE1;
    --amber:#A66A12; --amber-soft:#F0E2CA;
    --teal:#1B6B67; --teal-soft:#D9EAE8;
    --rust:#9C3B2E; --rust-soft:#F2DFDB;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sp:clamp(16px,3vw,28px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
      --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
      --amber:#DFA244; --amber-soft:#3A2F1C;
      --teal:#56B4AD; --teal-soft:#16302F;
      --rust:#D4776A; --rust-soft:#3A221E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
    --amber:#DFA244; --amber-soft:#3A2F1C;
    --teal:#56B4AD; --teal-soft:#16302F;
    --rust:#D4776A; --rust-soft:#3A221E;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-ship{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>
</head>

<script>
const PAGES  = [{"id": "overview", "title": "The Emperor's Expendables", "group": "Campaign", "type": "doc", "typeLabel": "Session", "dek": "Collared prisoners, deniable missions, and a handler who holds the off switch.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<p>Shortly after the destruction of the Death Star, the Empire found a use for prisoners it could afford to lose. Fitted with <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars and handed to <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>, they became deniable assets: sent where regular troops could not be seen, and switched off if they strayed. Somewhere in the Imperial paperwork they are known, unofficially, as <a class=\"wl\" href=\"#penal-program\">the Emperor's Dirty Dozen</a>.</p><p>Three of them are the crew this wiki follows.</p><h2>The Crew</h2><ul><li><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> — Twi'lek confidence artist and social thief, the crew's face and its most dangerous liar.</li><li><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> — disgraced Imperial combat veteran, the crew's gun and its shield.</li><li><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> — Duros starfighter pilot on contract to <a class=\"wl\" href=\"#kordyne\">Kordyne</a>, with no ship left to fly.</li></ul><h2>The Story So Far</h2><div class=\"panel note\"><div class=\"ph\">Episode I — The Collars Come Out</div><p>The crew's intake, their fitting with collars and their first dealings with <a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a>, <a class=\"wl\" href=\"#lysa-venn\">Sergeant Lysa Venn</a> and <a class=\"wl\" href=\"#rx-44\">Rex</a> happened before this record begins. Those pages are stubs for now.</p></div><p><strong>Mission 01 — No Survivors on Vannix Station.</strong> Concluded in <a class=\"wl\" href=\"#session-1\">Session 1 — No Survivors on Vannix Station</a>. The crew were crashed into <a class=\"wl\" href=\"#vannix-station\">Vannix</a> aboard the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a> to recover data, erase evidence and remove witnesses under cover of a pirate raid. They found proof of an Imperial massacre instead, learned what the collars really are, and were stopped at the threshold of <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a> when the collars shut them down.</p><p><strong>Interlude — Custody.</strong> A debrief with <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> aboard what may be a moving Imperial vessel. See <a class=\"wl\" href=\"#session-2\">Session 2 — The Rennick Run</a>.</p><p><strong>Episode II / Mission 02 — The Mercy of Colonel Rennick.</strong> In progress. Orders: kill <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>, the garrison commander of <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>, and make it look like an accident. The crew's cover at <a class=\"wl\" href=\"#redfall-station\">Redfall</a> did not survive its first night out. See <a class=\"wl\" href=\"#session-2\">Session 2 — The Rennick Run</a> and <a class=\"wl\" href=\"#session-3\">Session 3 — The Cantina Breaks</a>.</p><h2>Where Things Stand</h2><p>The morning after the brawl at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>. The crew are holed up in a <a class=\"wl\" href=\"#loggers-house\">logger's house</a> at the edge of town, <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> is badly hurt, and <a class=\"wl\" href=\"#ilse-wove\">Wove</a> is at the door asking for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> by name. See <a class=\"wl\" href=\"#threads\">Open Threads</a> for everything still open.</p>", "backlinks": [], "search": "the emperor's expendables collared prisoners, deniable missions, and a handler who holds the off switch."}, {"id": "timeline", "title": "Campaign Timeline", "group": "Campaign", "type": "doc", "typeLabel": "Session", "dek": "Every beat in order, marked by mission. INT is the custody interlude.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<h2>Session 1</h2><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Collared and deployed</strong><p><a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> loads collared prisoners aboard the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a>, staged as a pirate raider.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The crash</strong><p>The freighter hits <a class=\"wl\" href=\"#vannix-station\">Vannix</a>. <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> become rivals; the <a class=\"wl\" href=\"#cautious-nikto\">Cautious Nikto</a> dies to <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s grenade and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> takes his pistol.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Communications Control</strong><p><a class=\"wl\" href=\"#telsa-brie\">Telsa</a> and <a class=\"wl\" href=\"#rusk\">Rusk</a> are caught moving proof of a massacre off-station. The transmission freezes at 91%; <a class=\"wl\" href=\"#rusk\">Rusk</a> keeps the clean copy.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>What the collars are</strong><p><a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> is revealed as ISB restraint tech with a sealed final response, relayed through the <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a>.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The Core</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> takes <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> hostage; <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a> and the core's defenders fall. A ceasefire with <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a>.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>False loop</strong><p>The <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a> identifies all five collars; <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> loops its lock and starts a redirect.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The standoff</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> moves to execute <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>; <a class=\"wl\" href=\"#sera\">Sera</a> draws on her. How it ended was never played out.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The spine</strong><p>A stolen freight platform stalls four decks above a checkpoint that has just tagged the collars.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The drop</strong><p><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> releases the brake and the platform crushes the checkpoint. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> executes the survivor.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The bulkhead</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a> forces the lockdown; <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> holds the door until everyone is through.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Capture</strong><p>Within sight of <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>, the final response drops all five collar-bearers. <em>\"Cute. Sit tight.\"</em> 5 XP each.</p></div></div><h2>Session 2</h2><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>Custody</strong><p>Cells on what feels like a moving <a class=\"wl\" href=\"#detention-vessel\">vessel</a>. A medical team heals everyone before any questions.</p></div></div><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>Guard gossip</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> gets a guard talking: silent running, cagey command, and \"the <em>Rennick</em> run\".</p></div></div><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>The debrief</strong><p><a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> take the blame. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s \"Who's Telsa?\" is caught out by a voiceprint.</p></div></div><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>Silence</strong><p><a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> reads the crew's silence as proof the <a class=\"wl\" href=\"#vannix-evidence\">Vannix evidence</a> survived. \"Later, and less politely.\"</p></div></div><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>Mission 02</strong><p>Kill <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> and make it look like an accident. Not negotiable.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Redfall</strong><p>Landfall at <a class=\"wl\" href=\"#redfall-station\">Redfall</a> as a surveying and timber outfit. Relaxed soldiers, a bored customs check.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>The cantina</strong><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a> holds court at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>. The bartender tells <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> the town's peace has <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>'s name on it.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>The sweep</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s <a class=\"wl\" href=\"#forged-permits\">forged permits</a> are flagged mid-flirt with <a class=\"wl\" href=\"#bant-corrl\">Corrl</a>. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> staggers into the officer; <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> is caught eavesdropping.</p></div></div><h2>Session 3</h2><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>The cantina breaks</strong><p>Three-sided brawl: sweep officers and loyal troopers, anti-Imperial locals, and the crew.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Two officers down</strong><p><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> drops the first <a class=\"wl\" href=\"#id-sweep-officers\">officer</a>; <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> kills the second.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Corrl turns</strong><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a> commits against the crew. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s attempt to win him back fails.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Vesh falls</strong><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a> shoots <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> twice in the doorway; the second shot leaves a serious wound.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Sirens</strong><p>Constabulary arrive. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> carries <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> out and all three escape together.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Marn Oshel</strong><p>A backcountry local observes that the crew \"doesn't fight like surveyors\", and leaves. 5 XP each.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Wove at the door</strong><p>Morning at the <a class=\"wl\" href=\"#loggers-house\">logger's house</a>. <a class=\"wl\" href=\"#ilse-wove\">Wove</a> asks for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> by name.</p></div></div>", "backlinks": [], "search": "campaign timeline every beat in order, marked by mission. int is the custody interlude."}, {"id": "threads", "title": "Open Threads", "group": "Campaign", "type": "doc", "typeLabel": "Session", "dek": "What the campaign is currently holding unresolved.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<div class=\"thread hot\"><div class=\"st\">Live scene</div><h3>Wove at the door</h3><p><a class=\"wl\" href=\"#ilse-wove\">Wove</a> is outside the <a class=\"wl\" href=\"#loggers-house\">logger's house</a> with two troopers, asking for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> alone and by name. Talk, flee or fight are all still possible. What she actually knows, as opposed to what she is fishing for, is anyone's guess.</p></div><div class=\"thread hot\"><div class=\"st\">Untreated</div><h3>Vesh's wound</h3><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a>'s second shot left <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> with a wound that has not been treated. He is conscious, grey around the mouth, and in no state to fight.</p></div><div class=\"thread hot\"><div class=\"st\">Burned</div><h3>The cover at Redfall</h3><p>Two dead Imperial officers, a wrecked <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> and a hostile witness in <a class=\"wl\" href=\"#bant-corrl\">Corrl</a>. The surveying outfit is unlikely to survive another look. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s <a class=\"wl\" href=\"#forged-permits\">forged permits</a> were last seen in a dead officer's hand.</p></div><div class=\"thread open\"><div class=\"st\">Primary</div><h3>The kill order</h3><p><a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> wants <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> dead and the death deniable. Comply, subvert or defy — the collars make every option expensive.</p></div><div class=\"thread open\"><div class=\"st\">Not yet met</div><h3>Kenno and Rennick</h3><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> served with <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> years ago and measured \"doing it right\" against him. The crew have not met the colonel yet. When they do, he may recognise <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>.</p></div><div class=\"thread open\"><div class=\"st\">Hostile witness</div><h3>Corrl</h3><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a> liked <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> for about five minutes. Now he has every reason to name the crew if <a class=\"wl\" href=\"#ilse-wove\">Wove</a> asks.</p></div><div class=\"thread open\"><div class=\"st\">Unknown</div><h3>Marn Oshel</h3><p>A backcountry local who saw the crew fight and wasn't fooled. Nobody knows what he wants or who he'll tell.</p></div><div class=\"thread open\"><div class=\"st\">Deferred</div><h3>The Vannix evidence</h3><p><a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> believes the <a class=\"wl\" href=\"#vannix-evidence\">massacre evidence</a> survived and that someone is carrying it. He has promised to raise it again, \"less politely\".</p></div><div class=\"thread open\"><div class=\"st\">Background</div><h3>The collars</h3><p>Where is the true root controller for <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a>? Can the final response be blocked, reversed or removed? Nobody has answers yet.</p></div><div class=\"thread open\"><div class=\"st\">Dormant</div><h3>Vannix loose ends</h3><p>What happened to <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>, <a class=\"wl\" href=\"#rusk\">Rusk</a>, <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> after the Core? <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>'s people found no bodies.</p></div><div class=\"thread open\"><div class=\"st\">Suspicion</div><h3>Where were we held?</h3><p>The thrum, the lean in the deck, the groan. The crew suspect their custody was aboard a moving <a class=\"wl\" href=\"#detention-vessel\">ship</a>. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> asked if they'd worked it out; they didn't say.</p></div><div class=\"thread open\"><div class=\"st\">Unresolved</div><h3>The code cylinder</h3><p>Whether <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> still has her <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a> after the capture hasn't been settled. <a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a> knows it exists.</p></div>", "backlinks": ["cresh-spike", "overview"], "search": "open threads what the campaign is currently holding unresolved."}, {"id": "session-3", "title": "Session 3 — The Cantina Breaks", "group": "Sessions", "type": "doc", "typeLabel": "Session", "dek": "Two officers dead, a sergeant turned, a pilot down, and a knock at the door.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<h2>Three Sides</h2><p>The <a class=\"wl\" href=\"#id-sweep-officers\">officer</a> holding <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> ran out of patience and tried to drag her out, and the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> came apart. The two sweep officers and a table of loyal troopers took one side, a knot of anti-Imperial locals waded in on the other, and the crew were caught between them. <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> held back from both.</p><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> fired on the officer holding <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> and missed, but opened a lane. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> tried a knee strike behind a damsel-in-distress act; it did not land, but the act was good enough to pull a sympathiser to her side. The officer shot her point-blank on stun. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> shot him in turn and dropped him.</p><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> turned on the second officer and killed him with a cold, precise three-shot burst. Watching his own people die, <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> finally chose a side, and it was not the crew's. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s desperate attempt to win him back failed badly.</p><h2>Corrl's Shots</h2><p>Loyalist reinforcements arrived and broke the locals. The crew looted a binder-release key and a spare charge pack off the first officer, and <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> broke for the exit, laying down suppressing fire to cover the others.</p><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a> shot him anyway — once, blind and precise, as he reached the doorway, and then again. The second shot put <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> down in the doorway with a serious wound.</p><p>Constabulary sirens ended it. The locals who could still move scattered, and the troopers fell back around <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> rather than give chase. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> hauled <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> out through a side passage, and all three got away into the dark together.</p><h2>The Logger's House</h2><p>In the confusion a backcountry local, <a class=\"wl\" href=\"#marn-oshel\">Marn</a>, was briefly there. He remarked flatly that the crew \"doesn't fight like surveyors\", ignored <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s attempt to draw him out, and walked off into the night.</p><p>The crew went to ground in a borrowed <a class=\"wl\" href=\"#loggers-house\">logger's house</a> at the edge of <a class=\"wl\" href=\"#redfall-station\">Redfall</a>. Overnight they pulled <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> back from the edge, though his wound is still untreated, and <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> got their breath back.</p><p>Encounter award: 5 XP each.</p><h2>Wove at the Door</h2><p>Grey morning light. <a class=\"wl\" href=\"#ilse-wove\">Wove</a>, <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>'s second, walked up to the house in person with two troopers and asked to speak to <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> — by name, and alone. She has not drawn a weapon or made a threat. She is standing at the door, hands clasped, waiting.</p><p>Nobody has answered it yet.</p>", "backlinks": ["cathals-reach-garrison", "overview", "redfall-cantina"], "search": "session 3 — the cantina breaks two officers dead, a sergeant turned, a pilot down, and a knock at the door."}, {"id": "session-2", "title": "Session 2 — The Rennick Run", "group": "Sessions", "type": "doc", "typeLabel": "Session", "dek": "Custody, the debrief, new orders, and a cover identity tested on its first night.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<h2>Somewhere Moving</h2><p>The crew woke in cells along a narrow curved corridor: no windows, no chrono, and a deep thrum in the deck that never stopped. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> felt the floor lean for half a second, which no station should do, and a distant metallic groan made the passing guard glance away like he had heard it before. Wherever this <a class=\"wl\" href=\"#detention-vessel\">holding facility</a> was, it did not feel stationary.</p><p>An unseen medical team patched all three back to full health before anyone asked them a question.</p><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> charmed a guard into stopping at her cell and then into gossiping. He admitted the detail had been running silent for days with no rotations and that command was cagey even with its own people, and he let slip the name of the next job, \"the <em>Rennick</em> run\", once \"this lot's processed\". <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> found no weakness in his cell, but did find a reason to crouch out of the camera's view beside a floor grate that rang oddly hollow.</p><h2>The Debrief</h2><p>Guards walked all three into a bare room to face <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>, who wanted their account of Vannix.</p><p>They blamed <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a>. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> was not convinced: his recovery teams had found no matching bodies, which meant the pair were either loose or the story was thinner than it looked. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> then gave a clean account of moving to eliminate <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> as a loose end and <a class=\"wl\" href=\"#sera\">Sera</a> stopping her, which fitted what he knew of <a class=\"wl\" href=\"#sera\">Sera</a>, and he let it stand.</p><p>When he asked about <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>, <a class=\"wl\" href=\"#rusk\">Rusk</a> and the <a class=\"wl\" href=\"#vannix-evidence\">evidence</a>, <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> tried \"Who's Telsa?\". <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> answered with his own recovery logs and a partial voiceprint naming all three of them, and marked the lie against them. Pressed again, the crew said nothing. He read the silence as confirmation that the evidence survived, rested two fingers on his collar-control cylinder without using it, and said the matter would be revisited \"later, and less politely\".</p><p>He asked whether they knew where they were. They gave him nothing, and he moved on.</p><p>Then he gave them Mission 02: kill <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>, garrison commander of <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>, and make it look like an accident, a rebel strike or a hunting mishap. <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> had refused a reprisal massacre after a rebel ambush killed his soldiers, and hunted the actual cell himself instead. Command considers that restraint ideological contagion — proof that fear isn't needed to hold a world — and wants him erased before the example spreads. The order was not negotiable.</p><h2>Redfall</h2><p>The crew landed at <a class=\"wl\" href=\"#redfall-station\">Redfall</a> under cover as an independent surveying, game and timber outfit: <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> as its face, <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> as camp boss and <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> as pilot and logistics. A bored customs officer waved a scanner over their <a class=\"wl\" href=\"#forged-permits\">forged permits</a>. Nearby, two off-duty soldiers shared a thermos and a joke, more relaxed than garrison troops on an occupied world have any right to be.</p><p>The <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> was warm, loud and unafraid. Troopers drank with loggers, a card game ran hot in the corner, and <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> held court at the longest table, buying rounds and plainly loved. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s round at the bar earned nothing but a reason to linger. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> did better: the bartender told him the town isn't happy, exactly, but isn't grieving either, and that the peace has a name on it — a commander who \"actually looks at what's in front of him 'stead of just following the book\".</p><h2>The Sweep</h2><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> went to work on <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> and had him charmed — right up until an Imperial ID sweep came in and flagged her permits as inconsistent with the spaceport manifest. An <a class=\"wl\" href=\"#id-sweep-officers\">officer</a> took her by the arm, and <a class=\"wl\" href=\"#bant-corrl\">Corrl</a>'s warmth went cold.</p><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>, three drinks in, staggered into the officer just as he reached for his comlink and bought a few seconds of confusion. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>, trying to eavesdrop, was caught at it, and a second officer fixed his attention on him and kept it there.</p><p>The session ended with <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> in custody's grip, <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> marked, and <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> watching in silence.</p>", "backlinks": ["overview"], "search": "session 2 — the rennick run custody, the debrief, new orders, and a cover identity tested on its first night."}, {"id": "session-1", "title": "Session 1 — No Survivors on Vannix Station", "group": "Sessions", "type": "doc", "typeLabel": "Session", "dek": "Mission 01, start to finish: the crash, the evidence, the collars, and the capture.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<p><a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> took custody of a batch of collared prisoners and loaded them aboard the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a>, a freighter staged to look like a pirate raider. The plan was to crash it into <a class=\"wl\" href=\"#vannix-station\">Vannix</a>, and while the station believed it was being raided, the prisoners would recover data, erase evidence and remove witnesses.</p><h2>The Wreck</h2><p>The crash scattered everyone. Two other prisoners, <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a>, became competitors almost at once. A Nikto gunman in the group — <a class=\"wl\" href=\"#cautious-nikto\">the Cautious Nikto</a> — died in the escape from the wreck, caught by <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s frag grenade, and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> came away with his pirate pistol. The <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a> burned behind them, station security started hunting for intruders, and the crew went deeper into the station rather than wait for the cover-up to close around them.</p><h2>The Evidence</h2><p>In <a class=\"wl\" href=\"#communications-control\">Communications Control</a> they found <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>, a junior technician, and a battered astromech called <a class=\"wl\" href=\"#rusk\">Rusk</a>, trying to get proof of an Imperial massacre off the station. The crew froze the outgoing transmission at 91%, but <a class=\"wl\" href=\"#rusk\">Rusk</a> kept the cleanest copy. A security-droid response forced everyone onto an emergency route, and <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> became the crew's guide — they were her best chance of keeping the <a class=\"wl\" href=\"#vannix-evidence\">evidence</a> alive.</p><h2>What the Collars Are</h2><p>Through <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>'s digging, the crew learned the truth about <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a>: an ISB-modified restraint system with tracking, forced compliance, remote stun and a sealed \"final response\". The collars are batch-linked to a remote command structure. Vannix could mirror their traffic but not remove them, and the true command relay was an approaching gunship, the <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a>.</p><h2>The Core</h2><p><a class=\"wl\" href=\"#telsa-brie\">Telsa</a> got into the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> through Station Chief <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, a wounded whistleblower of his own. It turned violent when <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> took <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> hostage. <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, two security survivors and the core's security droid went down, and a collapsing gantry buried one of the doors.</p><p><a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> reappeared mid-fight and accepted a narrow ceasefire after <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> offered them a path toward collar freedom. <a class=\"wl\" href=\"#kalax\">Kalax</a> opened a relay panel under the core; the <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a> briefly identified all five collar-bearers, and <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> forced its lock into a false maintenance loop. Then she agreed to steer the gunship to the wrong part of the station.</p><p>As she worked, <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> stepped behind her to finish her. <a class=\"wl\" href=\"#sera\">Sera</a>, who had twice argued that <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> was worth keeping, raised her weapon at <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>. An attempt to make <a class=\"wl\" href=\"#kalax\">Kalax</a> force his partner to stand down failed, and the truce turned against <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> while the redirect began to recalculate.</p><p>How that standoff ended was never played out. The crew got clear of the core with the evidence, and what became of <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>, <a class=\"wl\" href=\"#rusk\">Rusk</a>, <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> is still unknown.</p><h2>The Drop</h2><p>The crew commandeered a freight platform and rode it down the station's spine toward a bribed berth at <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>. It stalled four decks above an Imperial checkpoint whose scan-tech had just tagged all five collar signatures, while sealing doors closed overhead.</p><p><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> forced the manual brake release with a shriek of metal, and the platform came down on the checkpoint. The scan-tech and one trooper died outright; <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> executed the second, pinned in the wreckage. The shriek brought a squad up behind them and triggered a lockdown bulkhead ahead.</p><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> forced the override with her <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a>, <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> shielded <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> and returned fire, and <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> spent his last stun grenade covering the retreat. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> held the doorway until all three were through, then sealed it on the squad. A dash down a service corridor, a ladder, and a corroded hatch that <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> forced open loudly brought them into a cargo bay within sight of <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>.</p><h2>Capture</h2><p>At the threshold, the <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> final response fired across all five collars at once — no local trace, no console, no gunship required. The three dropped where they stood, joints locked, as Imperial personnel closed in from three directions. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>'s voice came over a bulkhead speaker: <em>\"Cute. Sit tight.\"</em></p><p>Mission 01 ended in capture. 5 XP each.</p>", "backlinks": ["cassian-vorn", "overview"], "search": "session 1 — no survivors on vannix station mission 01, start to finish: the crash, the evidence, the collars, and the capture."}, {"id": "eleena-daru", "title": "Eleena Daru", "group": "Player Characters", "type": "character", "typeLabel": "Character", "dek": "Twi'lek confidence artist. Reads what you want before you know you've shown it.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A blue-skinned Twi'lek smuggler and scoundrel, sentenced for trying to rob \"the wrong rich Imperial\". She survives on charm, misdirection and emotional leverage, and she is the crew's strongest liar and negotiator by some distance. Playful, predatory and adaptive, and at her most dangerous when she seems least so.</p><h2>History</h2><ul><li>Once smoke-bombed <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> and left him to face armed trouble alone. He remembers.</li><li>Carries an officer-grade Imperial <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a>. <a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a> knows it exists.</li><li>Made enemies of <a class=\"wl\" href=\"#kalax\">Kalax</a> and especially <a class=\"wl\" href=\"#sera\">Sera</a> on <a class=\"wl\" href=\"#vannix-station\">Vannix</a>.</li></ul><h2>On Vannix</h2><p>Killed the <a class=\"wl\" href=\"#cautious-nikto\">Cautious Nikto</a> with a frag grenade in the escape from the wreck. Took <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> hostage in the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a>, bought a ceasefire from <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> with the promise of collar freedom, and then moved to execute <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> once her usefulness was nearly spent — which is what turned <a class=\"wl\" href=\"#sera\">Sera</a>'s gun on her. Executed a pinned checkpoint trooper during the drop, and forced the lockdown bulkhead open with her <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a>. At the debrief she told <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> the truth about <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>, and it served her better than <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s lie served him.</p><h2>On Cathal's Reach</h2><p>The face of the surveying outfit at <a class=\"wl\" href=\"#redfall-station\">Redfall</a>. Had <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> charmed until the ID sweep flagged her <a class=\"wl\" href=\"#forged-permits\">forged permits</a>. In the brawl she was stunned point-blank, played the damsel well enough to win a sympathiser, and spent a desperate gamble trying to win <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> back. It failed.</p><p><a class=\"wl\" href=\"#ilse-wove\">Wove</a> has come to the <a class=\"wl\" href=\"#loggers-house\">logger's house</a> asking for her by name.</p>", "backlinks": ["timeline", "ilse-wove", "elo-kesh", "kalax", "kenno-thorn", "bant-corrl", "threads", "sera", "session-1", "session-2", "session-3", "telsa-brie", "cautious-nikto", "central-computer-core", "code-cylinder", "overview", "forged-permits", "id-sweep-officers", "loggers-house", "vesh-talorr"], "search": "eleena daru twi'lek confidence artist. reads what you want before you know you've shown it."}, {"id": "kenno-thorn", "title": "Kennaud \"Kenno\" Thorn", "group": "Player Characters", "type": "character", "typeLabel": "Character", "dek": "Disgraced Imperial veteran. Controls space, absorbs punishment, trusts no chain of command.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["Kennaud Thorn"], "html": "<p>A human hired gun and mercenary soldier who knows Imperial procedure from the inside. He was sentenced after the fallout of an unlawful battlefield order, and for assaulting the officer who tried to make him carry the blame for it. Blunt, direct, violent when required, and deeply suspicious of any command that wants him to be disposable.</p><h2>History</h2><ul><li>Served with <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> years ago, before his fall. <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> was the officer he measured \"doing it right\" against.</li><li>His full name is something he keeps close. <a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a> knew it, which he did not expect.</li><li>Studied his <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collar during the fitting: a magnetic latch, a receiver node at the nape, and a recessed technician's service port.</li><li>Made an enemy of <a class=\"wl\" href=\"#kalax\">Kalax</a>.</li></ul><h2>On Vannix</h2><p>Took the <a class=\"wl\" href=\"#cautious-nikto\">Cautious Nikto</a>'s pirate pistol after the wreck. Shielded <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> through the checkpoint fight and held the bulkhead doorway under fire until everyone was through, then sealed it. At the debrief he tried \"Who's Telsa?\" on <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>, who answered with a voiceprint.</p><h2>On Cathal's Reach</h2><p>Camp boss and muscle for the surveying outfit. Three drinks into a failed charm offensive at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>, he turned a stagger into cover for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>. When it broke, he killed the second <a class=\"wl\" href=\"#id-sweep-officers\">sweep officer</a> with a three-shot burst, and afterwards carried <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> out on his back.</p><p>He has not met <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> yet.</p>", "backlinks": ["timeline", "doran-rennick", "cresh-spike", "eleena-daru", "elo-kesh", "kalax", "cassian-vorn", "marn-oshel", "bant-corrl", "threads", "session-1", "session-2", "session-3", "telsa-brie", "cautious-nikto", "overview", "forged-permits", "id-sweep-officers", "redfall-cantina"], "search": "kennaud \"kenno\" thorn kennaud thorn disgraced imperial veteran. controls space, absorbs punishment, trusts no chain of command."}, {"id": "vesh-talorr", "title": "Vesh Talorr", "group": "Player Characters", "type": "character", "typeLabel": "Character", "dek": "Duros starfighter pilot with a legend to build and no ship to build it in.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Corellian-born Duros pilot contracted to <a class=\"wl\" href=\"#kordyne\">Kordyne</a>. Calm in the cockpit, precise under pressure, and ambitious enough to treat every engagement as another line in the legend he means to have. His signature fighter, the <a class=\"wl\" href=\"#sure-thing\">Sure Thing</a>, is long gone — reassigned or impounded by <a class=\"wl\" href=\"#kordyne\">Kordyne</a> well before any of this, and still a sore point.</p><h2>History</h2><ul><li>Recognised <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> from a previous betrayal.</li><li><a class=\"wl\" href=\"#kordyne\">Kordyne</a> holds his contract debt.</li><li>Spotted a batch-synchronisation window in how the <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars are handled — a possible weakness in the procedure.</li></ul><h2>On Vannix</h2><p>Forced the freight platform's manual brake and brought it down on the checkpoint. Spent his last stun grenade covering the retreat, and forced the corroded hatch that led toward <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>. In custody he felt the floor lean when no floor should.</p><h2>On Cathal's Reach</h2><p>Pilot and logistics for the surveying outfit. Got the bartender at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> talking about <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>, then got caught eavesdropping. In the brawl he dropped the first <a class=\"wl\" href=\"#id-sweep-officers\">sweep officer</a> and covered the escape with suppressing fire, until <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> shot him twice in the doorway.</p><p>He is recovering at the <a class=\"wl\" href=\"#loggers-house\">logger's house</a> with an untreated wound, not fit to fight.</p>", "backlinks": ["timeline", "doran-rennick", "cresh-spike", "eleena-daru", "kenno-thorn", "kordyne", "bant-corrl", "threads", "session-1", "session-2", "session-3", "sure-thing", "detention-vessel", "overview", "forged-permits", "id-sweep-officers", "loggers-house", "redfall-cantina"], "search": "vesh talorr duros starfighter pilot with a legend to build and no ship to build it in."}, {"id": "cassian-vorn", "title": "Major Cassian Vorn", "group": "Handlers", "type": "character", "typeLabel": "Character", "dek": "The handler. Holds the collars, the orders, and the grudge.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The Imperial officer who runs the crew. Controlled, clipped and deniable, he holds authority over their <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars — including the final response that ended <a class=\"wl\" href=\"#session-1\">Mission 01</a> — and hands out missions that are not up for discussion.</p><p>He put the crew aboard the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a> and into <a class=\"wl\" href=\"#vannix-station\">Vannix</a> to bury a massacre under a pirate story. When the collars dropped them short of <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>, it was his voice on the bulkhead speaker: <em>\"Cute. Sit tight.\"</em></p><h2>The Debrief</h2><p>He took their account of Vannix without taking it at face value. He caught <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s lie about <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> with recovery logs and a voiceprint, and read the crew's silence as confirmation that the <a class=\"wl\" href=\"#vannix-evidence\">Vannix evidence</a> survived. He did not press — he rested two fingers on his collar-control cylinder and said it would be revisited \"later, and less politely\".</p><p>He also asked whether they knew where they were. They didn't answer.</p><h2>Mission 02</h2><p>Ordered the death of <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>, to look like an accident, a rebel strike or a hunting mishap. The crew have not heard from him since arriving on <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>, but expect to.</p>", "backlinks": ["timeline", "doran-rennick", "cresh-spike", "eleena-daru", "kalax", "kenno-thorn", "mournful-credit", "threads", "rusk", "sera", "lysa-venn", "session-1", "session-2", "telsa-brie", "detention-vessel", "overview", "penal-program", "vannix-evidence"], "search": "major cassian vorn the handler. holds the collars, the orders, and the grudge."}, {"id": "ilse-wove", "title": "Captain Ilse Wove", "group": "Cathal's Reach", "type": "character", "typeLabel": "Character", "dek": "Rennick's second. Watchful, blunt, and standing at the door.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p><a class=\"wl\" href=\"#doran-rennick\">Rennick</a>'s second-in-command on <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>: watchful, blunt and unimpressed by outsiders.</p><p>The morning after the brawl at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>, she came to the <a class=\"wl\" href=\"#loggers-house\">logger's house</a> in person with two troopers, introduced herself as garrison liaison, and asked to speak to <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> — by name, and alone. News of the brawl had plainly reached her overnight.</p><p>She has not drawn a weapon or made a threat. She stands with her hands clasped and lets what she might know do the work. How much she actually knows, and how much she is fishing for, is the question the crew have to answer before they open the door.</p>", "backlinks": ["timeline", "doran-rennick", "eleena-daru", "threads", "session-3", "cathals-reach-garrison", "overview", "loggers-house"], "search": "captain ilse wove rennick's second. watchful, blunt, and standing at the door."}, {"id": "doran-rennick", "title": "Colonel Doran Rennick", "group": "Cathal's Reach", "type": "character", "typeLabel": "Character", "dek": "The target. Refused to massacre a town, and Command wants him dead for it.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>Imperial Army garrison commander of <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>, and the man <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> has ordered the crew to kill.</p><h2>Why He's a Target</h2><p>After a rebel ambush killed several of his soldiers, Rennick was expected to carry out a doctrinal reprisal against the local population. He refused. He hunted down the cell responsible himself and left the town standing. His garrison has been unusually loyal and slow to desert ever since.</p><p>Command reads that as ideological contagion: living proof that fear isn't needed to hold a world. It wants him quietly erased before the idea spreads — by an accident, a rebel strike or a hunting mishap, nothing traceable.</p><h2>What the Crew Have Heard</h2><p>The bartender at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> told <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> that the town's peace has Rennick's name on it — a commander who \"actually looks at what's in front of him 'stead of just following the book\". Before that, a guard in custody let slip that the crew's next job was \"the <em>Rennick</em> run\".</p><h2>Kenno</h2><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> served with him years ago, before his own fall. Rennick was the officer Kenno measured \"doing it right\" against. They have not met again yet, and whether Rennick will recognise him is an open question.</p><p>His second is <a class=\"wl\" href=\"#ilse-wove\">Wove</a>.</p>", "backlinks": ["timeline", "ilse-wove", "cathals-reach", "kenno-thorn", "cassian-vorn", "threads", "session-2", "session-3", "cathals-reach-garrison", "overview", "redfall-cantina", "vesh-talorr"], "search": "colonel doran rennick the target. refused to massacre a town, and command wants him dead for it."}, {"id": "marn-oshel", "title": "Marn Oshel", "group": "Cathal's Reach", "type": "character", "typeLabel": "Character", "dek": "A backcountry local who wasn't fooled.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A weathered backcountry local who was briefly there the night the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> broke. He remarked flatly that the crew \"doesn't fight like surveyors\", and walked off into the dark. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> tried to draw him into conversation and got nothing.</p><p>What he wants, and who he might tell, is unknown.</p>", "backlinks": ["session-3"], "search": "marn oshel a backcountry local who wasn't fooled."}, {"id": "bant-corrl", "title": "Master Sergeant Bant Corrl", "group": "Cathal's Reach", "type": "character", "typeLabel": "Character", "dek": "The garrison's heart. Bought the rounds, then shot Vesh.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>Senior NCO of the <a class=\"wl\" href=\"#cathals-reach-garrison\">Cathal's Reach garrison</a>. Warm, loud and generous, he runs the culture of the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> and seems to know every trooper by name. The crew's first sight of him was at the head of the longest table, buying rounds, loved rather than merely obeyed.</p><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> had him charmed until the ID sweep came in. The moment uniforms were involved, his warmth went cold, and he held back from the fight until <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> killed the second <a class=\"wl\" href=\"#id-sweep-officers\">sweep officer</a> in front of him. Then he committed against the crew, and <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s attempt to win him back failed.</p><p>He shot <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> twice in the doorway, the second shot leaving a serious wound. When the constabulary arrived he held the scene rather than give chase.</p><p>He is now a hostile eyewitness with every reason to name the crew. Whatever he felt for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> is probably gone for good.</p>", "backlinks": ["timeline", "eleena-daru", "threads", "session-2", "session-3", "cathals-reach-garrison", "id-sweep-officers", "redfall-cantina", "vesh-talorr"], "search": "master sergeant bant corrl the garrison's heart. bought the rounds, then shot vesh."}, {"id": "id-sweep-officers", "title": "The ID-Sweep Officers", "group": "Cathal's Reach", "type": "character", "typeLabel": "Character", "dek": "Two Imperial officers who checked the wrong permits. Both dead.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>Two unnamed Imperial officers running an identity sweep through the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>.</p><p>The first flagged <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s <a class=\"wl\" href=\"#forged-permits\">forged permits</a> as inconsistent with the spaceport manifest and took her by the arm. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s drunken stagger knocked him off his comlink before he could call for backup. When he tried to drag her out, the cantina erupted. He shot <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> on stun, <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> dropped him, and the crew took a binder-release key and a spare charge pack off him. He did not survive the night's fighting.</p><p>The second caught <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> eavesdropping and never took his eyes off him again. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> killed him with a three-shot burst, which is what turned <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> against the crew.</p>", "backlinks": ["timeline", "kenno-thorn", "bant-corrl", "session-2", "session-3", "redfall-cantina", "vesh-talorr"], "search": "the id-sweep officers two imperial officers who checked the wrong permits. both dead."}, {"id": "galdrek-voss", "title": "Galdrek Voss", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "A Weequay pirate prisoner, staged for the false flag.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Weequay pirate prisoner staged as part of the false-flag raid on <a class=\"wl\" href=\"#vannix-station\">Vannix</a>: a real pirate to make the fake pirate story hold together.</p><p>He has no part in the current arc.</p>", "backlinks": [], "search": "galdrek voss a weequay pirate prisoner, staged for the false flag."}, {"id": "kalax", "title": "Kalax", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "Rival prisoner, brief ally, convenient scapegoat.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>One of the other collared prisoners crashed into <a class=\"wl\" href=\"#vannix-station\">Vannix</a> with the crew, and a competitor from the moment the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a> hit. He and his partner <a class=\"wl\" href=\"#sera\">Sera</a> reappeared in the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> and accepted a narrow ceasefire when <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> offered them a path toward collar freedom. Kalax opened the relay panel that let <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> loop the <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a>'s trace.</p><p>When <a class=\"wl\" href=\"#sera\">Sera</a> drew on <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>, he refused to turn a weapon on his own partner, and the truce hardened against the crew. He counts <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> and <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> as enemies.</p><p>At the debrief the crew blamed him for the mission's failures. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>'s people found no body. His fate is unconfirmed.</p>", "backlinks": ["timeline", "eleena-daru", "kenno-thorn", "sera-korr", "threads", "sera", "session-1", "session-2", "central-computer-core"], "search": "kalax rival prisoner, brief ally, convenient scapegoat."}, {"id": "sera-korr", "title": "Lieutenant Sera Korr", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "A wounded Imperial security officer. Not Kalax's Sera.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A wounded Imperial security officer from <a class=\"wl\" href=\"#vannix-station\">Vannix</a>. She shares a first name with <a class=\"wl\" href=\"#sera\">Sera</a>, <a class=\"wl\" href=\"#kalax\">Kalax</a>'s enforcer, but is a different person entirely.</p><p>She has no part in the current arc.</p>", "backlinks": ["sera"], "search": "lieutenant sera korr a wounded imperial security officer. not kalax's sera."}, {"id": "rusk", "title": "R6-K4 \"Rusk\"", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "A damaged astromech carrying the cleanest copy of the truth.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["R6-K4"], "html": "<p>A battered astromech working with <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> in <a class=\"wl\" href=\"#communications-control\">Communications Control</a>. When the crew froze the outgoing transmission, Rusk kept the cleanest copy of the <a class=\"wl\" href=\"#vannix-evidence\">massacre evidence</a>.</p><p>Its whereabouts and condition since the escape from the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> are unknown. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> asked about it by name.</p>", "backlinks": ["timeline", "communications-control", "threads", "session-1", "session-2", "telsa-brie", "vannix-evidence", "vannix-station"], "search": "r6-k4 \"rusk\" r6-k4 a damaged astromech carrying the cleanest copy of the truth."}, {"id": "sera", "title": "Sera (Kalax's Enforcer)", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "Kalax's partner. Drew on Eleena to keep Telsa alive.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>Collared prisoner, and <a class=\"wl\" href=\"#kalax\">Kalax</a>'s enforcer and partner on <a class=\"wl\" href=\"#vannix-station\">Vannix</a>. Not to be confused with <a class=\"wl\" href=\"#sera-korr\">Sera Korr</a>, an Imperial officer on the same station.</p><p>She twice argued that <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> was worth keeping alive. When <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> moved to execute <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> anyway, Sera caught it and levelled her weapon at <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>. <a class=\"wl\" href=\"#kalax\">Kalax</a> would not make her stand down. She is <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s enemy now.</p><p>The crew blamed her alongside <a class=\"wl\" href=\"#kalax\">Kalax</a> at the debrief. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> read her as a loyalist who protects whoever she has decided is worth protecting, and accepted that she had stalled the mission. Her fate is unconfirmed.</p>", "backlinks": ["timeline", "eleena-daru", "kalax", "sera-korr", "threads", "session-1", "session-2", "telsa-brie", "central-computer-core"], "search": "sera (kalax's enforcer) kalax's partner. drew on eleena to keep telsa alive."}, {"id": "arden-vel", "title": "Station Chief Arden Vel", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "Vannix's station chief, and a whistleblower of his own.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The chief of <a class=\"wl\" href=\"#vannix-station\">Vannix</a>, wounded and trying to preserve the evidence of what happened there. Through him, <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> got provisional access to the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a>. The confrontation there turned violent and he was incapacitated.</p><p>His status since the crew left the Core is unknown.</p>", "backlinks": ["timeline", "threads", "session-1", "telsa-brie", "central-computer-core"], "search": "station chief arden vel vannix's station chief, and a whistleblower of his own."}, {"id": "telsa-brie", "title": "Telsa Brie", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "The technician who tried to get the truth off Vannix. Fate unknown.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A junior communications technician on <a class=\"wl\" href=\"#vannix-station\">Vannix</a>. When the crew found her in <a class=\"wl\" href=\"#communications-control\">Communications Control</a>, she and <a class=\"wl\" href=\"#rusk\">Rusk</a> were trying to transmit proof of an Imperial massacre off the station. The crew froze the transmission at 91%.</p><p>After that she became the crew's guide, because they were her best chance of keeping the <a class=\"wl\" href=\"#vannix-evidence\">evidence</a> alive. It was her digging that exposed what <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> really is. She got into the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> through <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, was taken hostage there by <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>, and still forced the <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a>'s lock into a false loop and began redirecting it.</p><p>Then <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> moved behind her to kill her, and <a class=\"wl\" href=\"#sera\">Sera</a> drew on <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> to stop it. How that standoff ended was never played out. At the debrief <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> asked about her directly, and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s \"Who's Telsa?\" did not fool him.</p><p>Her whereabouts are unknown.</p>", "backlinks": ["black-warrant", "timeline", "communications-control", "cresh-spike", "eleena-daru", "kalax", "cassian-vorn", "threads", "rusk", "sera", "session-1", "session-2", "arden-vel", "central-computer-core", "code-cylinder", "vannix-evidence", "vannix-station"], "search": "telsa brie the technician who tried to get the truth off vannix. fate unknown."}, {"id": "cautious-nikto", "title": "The Cautious Nikto", "group": "Vannix", "type": "character", "typeLabel": "Character", "dek": "A Nikto gunman who didn't make it out of the wreck.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": ["The Nikto gunman"], "html": "<p>A Nikto gunman among the prisoners crashed into <a class=\"wl\" href=\"#vannix-station\">Vannix</a> aboard the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a>. He was killed by <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s frag grenade in the escape from the wreck, and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> took his pirate pistol.</p><p>Deceased.</p>", "backlinks": ["timeline", "eleena-daru", "kenno-thorn", "session-1"], "search": "the cautious nikto the nikto gunman a nikto gunman who didn't make it out of the wreck."}, {"id": "elo-kesh", "title": "Elo Kesh", "group": "Before Vannix", "type": "character", "typeLabel": "Character", "dek": "A cage-market broker who knows more than he should.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A cage-market broker and information contact from the crew's time in custody, before <a class=\"wl\" href=\"#vannix-station\">Vannix</a>.</p><p>He knows <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> carries a <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a>, and he knew <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s full name, which <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> did not expect. He has no part in the current arc, but what he knows could make him useful leverage one day.</p>", "backlinks": ["eleena-daru", "kenno-thorn", "threads", "code-cylinder", "overview"], "search": "elo kesh a cage-market broker who knows more than he should."}, {"id": "rx-44", "title": "RX-44 \"Rex\"", "group": "Before Vannix", "type": "character", "typeLabel": "Character", "dek": "A damaged security droid from the prison days.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": ["RX-44"], "html": "<p>A damaged security droid from the crew's original prison, before <a class=\"wl\" href=\"#vannix-station\">Vannix</a>.</p><p>It has no part in the current arc.</p>", "backlinks": ["overview"], "search": "rx-44 \"rex\" rx-44 a damaged security droid from the prison days."}, {"id": "lysa-venn", "title": "Sergeant Lysa Venn", "group": "Before Vannix", "type": "character", "typeLabel": "Character", "dek": "The detention authority at the crew's intake.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The detention authority who oversaw the crew's original intake, before they were collared and handed to <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>.</p><p>She has no part in the current arc.</p>", "backlinks": ["overview"], "search": "sergeant lysa venn the detention authority at the crew's intake."}, {"id": "bay-nine", "title": "Bay Nine", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "The bribed berth that should have been the way out.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A bribed berth on <a class=\"wl\" href=\"#vannix-station\">Vannix</a> that was supposed to be the crew's exit. They got within sight of its corridor, in a cargo bay at the top of a maintenance ladder, before the <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> final response dropped all three.</p>", "backlinks": ["black-warrant", "timeline", "cresh-spike", "cassian-vorn", "session-1", "code-cylinder", "overview", "vannix-station", "vesh-talorr"], "search": "bay nine the bribed berth that should have been the way out."}, {"id": "cathals-reach", "title": "Cathal's Reach", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "An occupied world that isn't afraid. That's the problem.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>An Imperial-garrisoned world of timber, logging and backcountry, held by the <a class=\"wl\" href=\"#cathals-reach-garrison\">Cathal's Reach garrison</a> under <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>. It is the setting of Mission 02.</p><p>The locals aren't happy about the occupation, but they aren't terrorised by it either — they treat it more like weather than war. People here credit that peace to <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>, and that peace is exactly why Command wants him dead.</p><p>The crew are based at <a class=\"wl\" href=\"#redfall-station\">Redfall</a>.</p>", "backlinks": ["ilse-wove", "doran-rennick", "cassian-vorn", "redfall-station", "session-2", "cathals-reach-garrison", "overview", "forged-permits", "penal-program"], "search": "cathal's reach an occupied world that isn't afraid. that's the problem."}, {"id": "communications-control", "title": "Communications Control", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Where the evidence was caught at 91%.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The communications hub of <a class=\"wl\" href=\"#vannix-station\">Vannix</a>. Here the crew found <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> and <a class=\"wl\" href=\"#rusk\">Rusk</a> mid-way through transmitting proof of a massacre off the station, and froze the transmission at 91%. <a class=\"wl\" href=\"#rusk\">Rusk</a> kept the cleanest copy. A security-droid response drove everyone out onto an emergency route.</p>", "backlinks": ["rusk", "session-1", "telsa-brie", "vannix-station"], "search": "communications control where the evidence was caught at 91%."}, {"id": "redfall-station", "title": "Redfall Station", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Spaceport and timber town. The crew's cover lasted one night here.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The spaceport and logging town on <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a> where the crew landed, posing as an independent surveying, game and timber outfit. Their cover gear is stored in a rented shed near the spaceport.</p><p>On arrival, a bored customs officer barely glanced at their <a class=\"wl\" href=\"#forged-permits\">forged permits</a>, and two off-duty soldiers shared a thermos and a joke nearby — a first glimpse of how unusually calm the place is.</p><p>The calm did not survive the crew. After the brawl at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>, the streets have the hush of a town waiting to see who gets blamed. The crew are lying low in a <a class=\"wl\" href=\"#loggers-house\">logger's house</a> on the edge of town.</p>", "backlinks": ["timeline", "cathals-reach", "eleena-daru", "session-2", "session-3", "overview", "forged-permits", "loggers-house", "redfall-cantina"], "search": "redfall station spaceport and timber town. the crew's cover lasted one night here."}, {"id": "central-computer-core", "title": "The Central Computer Core", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Hostages, a ceasefire, and a standoff nobody saw end.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>The heart of <a class=\"wl\" href=\"#vannix-station\">Vannix</a>'s systems. <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> gained access through <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>; <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> turned it into a hostage situation. <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, two security survivors and the core's security droid went down, and a collapsed gantry buried one of the doorways.</p><p>It was here that <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> took the ceasefire, <a class=\"wl\" href=\"#kalax\">Kalax</a> opened the relay panel beneath the core, and <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> looped the <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a>'s trace. It was also here that <a class=\"wl\" href=\"#sera\">Sera</a> drew on <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>. The crew got out with the evidence; how the standoff ended was never played.</p>", "backlinks": ["eleena-daru", "kalax", "rusk", "session-1", "arden-vel", "telsa-brie", "vannix-evidence", "vannix-station"], "search": "the central computer core hostages, a ceasefire, and a standoff nobody saw end."}, {"id": "detention-vessel", "title": "The Detention Vessel", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Where the crew were held after Vannix. Probably a ship. Nobody's confirmed it.", "conf": "lo", "confLabel": "Low confidence", "player": "", "aliases": [], "aka": [], "html": "<p>The crew woke here after <a class=\"wl\" href=\"#vannix-station\">Vannix</a>: cells along a narrow curved corridor, no windows, no chrono, and a deep thrum in the deck that never stopped. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> felt the floor lean, and a distant groan made a guard's eyes flick away like he had heard it before. The guards had been running silent for days.</p><p>The crew suspect it is a ship in transit. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> asked whether they knew where they were; they gave him nothing, and he didn't say. It has no name on record — the title here is a placeholder.</p><p>The debrief and the Mission 02 orders both happened here.</p>", "backlinks": ["timeline", "threads", "session-2"], "search": "the detention vessel where the crew were held after vannix. probably a ship. nobody's confirmed it."}, {"id": "loggers-house", "title": "The Logger's House", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "A borrowed refuge on the edge of town, with a captain at the door.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>A borrowed logger's house at the edge of <a class=\"wl\" href=\"#redfall-station\">Redfall</a>, where the crew went to ground after the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> brawl. It smells of woodsmoke and the antiseptic of the night's field dressing. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> is recovering by the hearth.</p><p>In grey morning light, <a class=\"wl\" href=\"#ilse-wove\">Wove</a> is standing outside the front door with two troopers, asking for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>.</p>", "backlinks": ["timeline", "ilse-wove", "eleena-daru", "threads", "redfall-station", "session-3", "overview", "vesh-talorr"], "search": "the logger's house a borrowed refuge on the edge of town, with a captain at the door."}, {"id": "redfall-cantina", "title": "The Redfall Cantina", "group": "Places", "type": "place", "typeLabel": "Place", "dek": "Warm, loud, unafraid of itself — until the crew came in. Now wrecked.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>The cantina at <a class=\"wl\" href=\"#redfall-station\">Redfall</a>, where off-duty troopers of the <a class=\"wl\" href=\"#cathals-reach-garrison\">Cathal's Reach garrison</a> drank alongside loggers and haulers, a card game ran hot in one corner, and <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> held court at the longest table.</p><p>The bartender was not impressed by <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s generosity, but he told <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> that the town's peace has <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>'s name on it.</p><p>In <a class=\"wl\" href=\"#session-3\">Session 3 — The Cantina Breaks</a> it became a three-sided brawl between the <a class=\"wl\" href=\"#id-sweep-officers\">ID-sweep officers</a> and loyal troopers, anti-Imperial locals, and the crew. Two officers died, <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> went down in the doorway, and the room was wrecked by the time the constabulary arrived.</p>", "backlinks": ["timeline", "ilse-wove", "doran-rennick", "kenno-thorn", "marn-oshel", "bant-corrl", "threads", "redfall-station", "session-2", "session-3", "cathals-reach-garrison", "overview", "forged-permits", "id-sweep-officers", "loggers-house", "vesh-talorr"], "search": "the redfall cantina warm, loud, unafraid of itself — until the crew came in. now wrecked."}, {"id": "vannix-station", "title": "Vannix Station",
