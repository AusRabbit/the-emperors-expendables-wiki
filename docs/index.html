<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#191D23; --muted:#59636F; --line:#D6DBE1;
    --amber:#A66A12; --amber-soft:#F0E2CA;
    --teal:#1B6B67; --teal-soft:#D9EAE8;
    --rust:#9C3B2E; --rust-soft:#F2DFDB;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sp:clamp(16px,3vw,28px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
      --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
      --amber:#DFA244; --amber-soft:#3A2F1C;
      --teal:#56B4AD; --teal-soft:#16302F;
      --rust:#D4776A; --rust-soft:#3A221E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
    --amber:#DFA244; --amber-soft:#3A2F1C;
    --teal:#56B4AD; --teal-soft:#16302F;
    --rust:#D4776A; --rust-soft:#3A221E;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-ship{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .talent-controls{display:grid; grid-template-columns:minmax(180px,2fr) repeat(3,minmax(120px,1fr)); gap:10px; margin:0 0 12px}
  .talent-controls input,.talent-controls select{width:100%; min-width:0; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink); font:14px var(--body)}
  .talent-controls input:focus,.talent-controls select:focus{outline:2px solid var(--amber); outline-offset:1px}
  .talent-summary{font:11px var(--mono); color:var(--muted); margin-bottom:14px}
  .talent-list{display:grid; gap:10px}
  .talent-card{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:14px 16px}
  .talent-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:5px}
  .talent-head h2{font-size:18px; line-height:1.2; border:0; padding:0; margin:0}
  .talent-tier{flex:none; font:10.5px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--amber); background:var(--amber-soft); border-radius:4px; padding:3px 7px}
  .talent-meta{font:10.5px var(--mono); color:var(--muted); margin-bottom:8px}
  .talent-card p{margin:0 0 8px}
  .talent-source{font-size:12.5px; color:var(--muted)}
  .talent-note{font-size:12.5px; color:var(--rust); margin-top:7px}
  .talent-empty{border:1px dashed var(--line); border-radius:9px; color:var(--muted); padding:22px; text-align:center}
  @media (max-width:720px){.talent-controls{grid-template-columns:1fr 1fr}.talent-controls input{grid-column:1/-1}}
  @media (max-width:460px){.talent-controls{grid-template-columns:1fr}.talent-controls input{grid-column:auto}}

  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>
</head>

<script>
const PAGES  = [{"id": "overview", "title": "The Emperor's Expendables", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Collared prisoners, deniable missions, and a handler who holds the off switch.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<p>Shortly after the destruction of the Death Star, the Empire found a use for prisoners it could afford to lose. Fitted with <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars and handed to <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>, they became deniable assets of the <a class=\"wl\" href=\"#penal-program\">Penal Black-Ops Program</a>: sent where regular troops could not be seen, and switched off if they strayed. Unofficially, they are known as the Emperor's Dirty Dozen.</p><p>Three of them are the crew this wiki follows.</p><h2>The Crew</h2><ul><li><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> — Twi'lek confidence artist and social thief, the crew's face and its most dangerous liar.</li><li><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> — disgraced Imperial combat veteran, the crew's gun and its shield.</li><li><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> — Duros starfighter pilot on contract to <a class=\"wl\" href=\"#kordyne\">Kordyne</a>, with no ship left to fly.</li></ul><h2>The Story So Far</h2><p><strong>Episode I — The Collars Come Out.</strong> Concluded. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> began in custody at <a class=\"wl\" href=\"#annex-17\">Annex 17</a>, where a failed escape and a Cage Market fight against <a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew marked them as dangerous. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> was bound in alongside them. All three were collared and handed to <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> of the <a class=\"wl\" href=\"#isb\">ISB</a>. Summarised at the top of <a class=\"wl\" href=\"#session-1\">Session 1 — No Survivors on Vannix Station</a>.</p><p><strong>Mission 01 — No Survivors on Vannix Station.</strong> Concluded in <a class=\"wl\" href=\"#session-1\">Session 1 — No Survivors on Vannix Station</a>. The crew were crashed into <a class=\"wl\" href=\"#vannix-station\">Vannix Relay Station</a> aboard the unmanned <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a>, with <a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew sent in as competition, to take the data core, erase the records and leave no witnesses under cover of a pirate raid. They found proof of an Imperial massacre instead, learned what the collars really are, and were stopped at the threshold of <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a> when the collars shut them down.</p><p><strong>Interlude — Custody.</strong> A debrief with <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> aboard what may be a moving Imperial vessel. See <a class=\"wl\" href=\"#session-2\">Session 2 — The Rennick Run</a>.</p><p><strong>Episode II / Mission 02 — The Mercy of Colonel Rennick.</strong> In progress. Orders: kill <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>, the garrison commander of <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>, and make it look like an accident. The crew's cover at <a class=\"wl\" href=\"#redfall-station\">Redfall</a> did not survive its first night out. See <a class=\"wl\" href=\"#session-2\">Session 2 — The Rennick Run</a> and <a class=\"wl\" href=\"#session-3\">Session 3 — The Cantina Breaks</a>.</p><h2>Where Things Stand</h2><p>The morning after the brawl at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>. The crew are holed up in a <a class=\"wl\" href=\"#loggers-house\">logger's house</a> at the edge of town, <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> is badly hurt, and <a class=\"wl\" href=\"#ilse-wove\">Wove</a> is at the door asking for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> by name. See <a class=\"wl\" href=\"#threads\">Open Threads</a> for everything still open.</p>", "backlinks": [], "search": "the emperor's expendables collared prisoners, deniable missions, and a handler who holds the off switch."}, {"id": "timeline", "title": "Campaign Timeline", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "timeline", "dek": "Every beat in order, marked by mission. EP1 is Episode I; INT is the custody interlude.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<h2>Before Session 1</h2><div class=\"beat\"><div class=\"t\">EP1</div><div class=\"b\"><strong>Annex 17</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> in custody at <a class=\"wl\" href=\"#annex-17\">Annex 17</a>. A failed escape and a Cage Market fight with <a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew mark them as dangerous prospects. They meet <a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a>.</p></div></div><div class=\"beat\"><div class=\"t\">EP1</div><div class=\"b\"><strong>Collared</strong><p><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> joins them. All three are collared, interrogated and handed to <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> of the <a class=\"wl\" href=\"#isb\">ISB</a>.</p></div></div><div class=\"beat\"><div class=\"t\">EP1</div><div class=\"b\"><strong>The orders</strong><p>Infiltrate <a class=\"wl\" href=\"#vannix-station\">Vannix</a>, take the data core, erase the records, stage a pirate attack, leave no witnesses. <a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew are sent as competition.</p></div></div><h2>Session 1</h2><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Collision course</strong><p>The crew wake aboard the unmanned <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a>. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> steers the crash into a maintenance collar; <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> seals the breach.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The fight in the wreck</strong><p><a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew go for weapons. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> wounds <a class=\"wl\" href=\"#kalax\">Kalax</a>; <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> breaks <a class=\"wl\" href=\"#sera\">Sera</a>'s weapon, and her grenade kills <a class=\"wl\" href=\"#cautious-nikto\">the Nikto</a>. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> takes his pistol.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The iris</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s attempt at a deal fails. <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> seal a service iris behind them and leave the crew exposed.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Communications Control</strong><p><a class=\"wl\" href=\"#telsa-brie\">Telsa</a> and <a class=\"wl\" href=\"#rusk\">Rusk</a> are caught moving proof of a massacre off-station. The transmission freezes at 91%; <a class=\"wl\" href=\"#rusk\">Rusk</a> keeps the clean copy.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The alcove</strong><p><a class=\"wl\" href=\"#telsa-brie\">Telsa</a> explains <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a>, the deniable-asset evidence and the Rebel relay cell. Her diagnostic on <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s collar shocks him but finds the command-node sync.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Patch-up</strong><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> uses the last stimpack and cobbles an improvised one for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>. <em>\"Buy me a drink first next time.\"</em></p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The cylinder</strong><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> catches <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> guessing about the core. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> produces her <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a>; station overalls all round.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The Core</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> takes <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> hostage; <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a> and the core's defenders fall. A ceasefire with <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a>.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>False loop</strong><p>The <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a> identifies all five collars; <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> loops its lock. Assault shuttles on approach.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The standoff</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> moves to execute <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>; <a class=\"wl\" href=\"#sera\">Sera</a> draws on her; <a class=\"wl\" href=\"#kalax\">Kalax</a> won't back Eleena. How it ended was never played out.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Which way out</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> names <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>; <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> argues for escape pods; <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> suggests the spine elevator.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The spine</strong><p>The freight platform stalls four decks above a checkpoint that has just tagged the collars.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The drop</strong><p><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> releases the brake and the platform crushes the checkpoint. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> executes the survivor.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>The bulkhead</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a> forces the lockdown; <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> holds the door until everyone is through.</p></div></div><div class=\"beat\"><div class=\"t\">M01</div><div class=\"b\"><strong>Capture</strong><p>Within sight of <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>, the final response drops all five collar-bearers. <em>\"Cute. Sit tight.\"</em> 5 XP each.</p></div></div><h2>Session 2</h2><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>Custody</strong><p>Cells on what feels like a moving <a class=\"wl\" href=\"#detention-vessel\">vessel</a>. A medical team heals everyone before any questions.</p></div></div><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>Guard gossip</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> gets a guard talking: silent running, cagey command, and \"the <em>Rennick</em> run\".</p></div></div><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>The debrief</strong><p><a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> take the blame. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s \"Who's Telsa?\" is caught out by a voiceprint.</p></div></div><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>Silence</strong><p><a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> reads the crew's silence as proof the <a class=\"wl\" href=\"#vannix-evidence\">The Vannix Evidence</a> survived. \"Later, and less politely.\"</p></div></div><div class=\"beat\"><div class=\"t\">INT</div><div class=\"b\"><strong>Mission 02</strong><p>Kill <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> and make it look like an accident. Not negotiable.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Redfall</strong><p>Landfall at <a class=\"wl\" href=\"#redfall-station\">Redfall</a> as a surveying and timber outfit. Relaxed soldiers, a bored customs check.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>The cantina</strong><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a> holds court at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>. The bartender tells <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> the town's peace has <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>'s name on it.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>The sweep</strong><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s <a class=\"wl\" href=\"#forged-permits\">forged permits</a> are flagged mid-flirt with <a class=\"wl\" href=\"#bant-corrl\">Corrl</a>. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> staggers into the officer; <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> is caught eavesdropping.</p></div></div><h2>Session 3</h2><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>The cantina breaks</strong><p>Three-sided brawl: sweep officers and loyal troopers, anti-Imperial locals, and the crew.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Two officers down</strong><p><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> drops the first <a class=\"wl\" href=\"#id-sweep-officers\">officer</a>; <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> kills the second.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Corrl turns</strong><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a> commits against the crew. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s attempt to win him back fails.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Vesh falls</strong><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a> shoots <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> twice in the doorway; the second shot leaves a serious wound.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Sirens</strong><p>Constabulary arrive. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> carries <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> out and all three escape together.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Marn Oshel</strong><p>A backcountry local observes that the crew \"doesn't fight like surveyors\", and leaves. 5 XP each.</p></div></div><div class=\"beat\"><div class=\"t\">M02</div><div class=\"b\"><strong>Wove at the door</strong><p>Morning at the <a class=\"wl\" href=\"#loggers-house\">logger's house</a>. <a class=\"wl\" href=\"#ilse-wove\">Wove</a> asks for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> by name.</p></div></div>", "backlinks": [], "search": "campaign timeline every beat in order, marked by mission. ep1 is episode i; int is the custody interlude."}, {"id": "threads", "title": "Open Threads", "group": "Campaign", "type": "doc", "typeLabel": "Session", "layout": "threads", "dek": "What the campaign is currently holding unresolved.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<div class=\"thread hot\"><div class=\"st\">Live scene</div><h3>Wove at the door</h3><p><a class=\"wl\" href=\"#ilse-wove\">Wove</a> is outside the <a class=\"wl\" href=\"#loggers-house\">logger's house</a> with two troopers, asking for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> alone and by name. Talk, flee or fight are all still possible. What she actually knows, as opposed to what she is fishing for, is anyone's guess.</p></div><div class=\"thread hot\"><div class=\"st\">Untreated</div><h3>Vesh's wound</h3><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a>'s second shot left <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> with a wound that has not been treated. He is conscious, grey around the mouth, and in no state to fight.</p></div><div class=\"thread hot\"><div class=\"st\">Burned</div><h3>The cover at Redfall</h3><p>Two dead Imperial officers, a wrecked <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> and a hostile witness in <a class=\"wl\" href=\"#bant-corrl\">Corrl</a>. The surveying outfit is unlikely to survive another look. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s <a class=\"wl\" href=\"#forged-permits\">forged permits</a> were last seen in a dead officer's hand.</p></div><div class=\"thread open\"><div class=\"st\">Primary</div><h3>The kill order</h3><p><a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> wants <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> dead and the death deniable. Comply, subvert or defy — the collars make every option expensive.</p></div><div class=\"thread open\"><div class=\"st\">Not yet met</div><h3>Kenno and Rennick</h3><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> served with <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> years ago and measured \"doing it right\" against him. The crew have not met the colonel yet. When they do, he may recognise <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>.</p></div><div class=\"thread open\"><div class=\"st\">Hostile witness</div><h3>Corrl</h3><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a> liked <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> for about five minutes. Now he has every reason to name the crew if <a class=\"wl\" href=\"#ilse-wove\">Wove</a> asks.</p></div><div class=\"thread open\"><div class=\"st\">Unknown</div><h3>Marn Oshel</h3><p>A backcountry local who saw the crew fight and wasn't fooled. Nobody knows what he wants or who he'll tell.</p></div><div class=\"thread open\"><div class=\"st\">Deferred</div><h3>The Vannix evidence</h3><p><a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> believes the <a class=\"wl\" href=\"#vannix-evidence\">evidence</a> survived and that someone is carrying it. It proves the massacre and the <a class=\"wl\" href=\"#penal-program\">Penal Black-Ops Program</a> behind the crew's own collars, and a Rebel relay cell was already in contact with the station. He has promised to raise it again, \"less politely\".</p></div><div class=\"thread open\"><div class=\"st\">Background</div><h3>The collars</h3><p>Where is the true root controller for <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a>? Can the final response be blocked, reversed or removed? <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>'s best lead was a calibration station, or a live technician console with officer-level keys, to spoof a maintenance cycle and perhaps kill the remote stun. <em>Maybe.</em></p></div><div class=\"thread open\"><div class=\"st\">Dormant</div><h3>Vannix loose ends</h3><p>What happened to <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>, <a class=\"wl\" href=\"#rusk\">Rusk</a>, <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> after the Core? <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>'s people found no bodies.</p></div><div class=\"thread open\"><div class=\"st\">Suspicion</div><h3>Where were we held?</h3><p>The thrum, the lean in the deck, the groan. The crew suspect their custody was aboard a moving <a class=\"wl\" href=\"#detention-vessel\">ship</a>. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> asked if they'd worked it out; they didn't say.</p></div><div class=\"thread open\"><div class=\"st\">Unresolved</div><h3>The code cylinder</h3><p>Whether <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> still has her <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a> after the capture hasn't been settled. <a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a> knows it exists.</p></div>", "backlinks": ["cresh-spike", "overview"], "search": "open threads what the campaign is currently holding unresolved."}, {"id": "session-3", "title": "Session 3 — The Cantina Breaks", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Two officers dead, a sergeant turned, a pilot down, and a knock at the door.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<h2>Three Sides</h2><p>The <a class=\"wl\" href=\"#id-sweep-officers\">officer</a> holding <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> ran out of patience and tried to drag her out, and the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> came apart. The two sweep officers and a table of loyal troopers took one side, a knot of anti-Imperial locals waded in on the other, and the crew were caught between them. <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> held back from both.</p><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> fired on the officer holding <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> and missed, but opened a lane. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> tried a knee strike behind a damsel-in-distress act; it did not land, but the act was good enough to pull a sympathiser to her side. The officer shot her point-blank on stun. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> shot him in turn and dropped him.</p><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> turned on the second officer and killed him with a cold, precise three-shot burst. Watching his own people die, <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> finally chose a side, and it was not the crew's. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s desperate attempt to win him back failed badly.</p><h2>Corrl's Shots</h2><p>Loyalist reinforcements arrived and broke the locals. The crew looted a binder-release key and a spare charge pack off the first officer, and <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> broke for the exit, laying down suppressing fire to cover the others.</p><p><a class=\"wl\" href=\"#bant-corrl\">Corrl</a> shot him anyway — once, blind and precise, as he reached the doorway, and then again. The second shot put <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> down in the doorway with a serious wound.</p><p>Constabulary sirens ended it. The locals who could still move scattered, and the troopers fell back around <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> rather than give chase. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> hauled <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> out through a side passage, and all three got away into the dark together.</p><h2>The Logger's House</h2><p>In the confusion a backcountry local, <a class=\"wl\" href=\"#marn-oshel\">Marn</a>, was briefly there. He remarked flatly that the crew \"doesn't fight like surveyors\", ignored <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s attempt to draw him out, and walked off into the night.</p><p>The crew went to ground in a borrowed <a class=\"wl\" href=\"#loggers-house\">logger's house</a> at the edge of <a class=\"wl\" href=\"#redfall-station\">Redfall</a>. Overnight they pulled <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> back from the edge, though his wound is still untreated, and <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> got their breath back.</p><p>Encounter award: 5 XP each.</p><h2>Wove at the Door</h2><p>Grey morning light. <a class=\"wl\" href=\"#ilse-wove\">Wove</a>, <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>'s second, walked up to the house in person with two troopers and asked to speak to <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> — by name, and alone. She has not drawn a weapon or made a threat. She is standing at the door, hands clasped, waiting.</p><p>Nobody has answered it yet.</p>", "backlinks": ["cathals-reach-garrison", "overview", "redfall-cantina"], "search": "session 3 — the cantina breaks two officers dead, a sergeant turned, a pilot down, and a knock at the door."}, {"id": "session-2", "title": "Session 2 — The Rennick Run", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Custody, the debrief, new orders, and a cover identity tested on its first night.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<h2>Somewhere Moving</h2><p>The crew woke in cells along a narrow curved corridor: no windows, no chrono, and a deep thrum in the deck that never stopped. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> felt the floor lean for half a second, which no station should do, and a distant metallic groan made the passing guard glance away like he had heard it before. Wherever this <a class=\"wl\" href=\"#detention-vessel\">holding facility</a> was, it did not feel stationary.</p><p>An unseen medical team patched all three back to full health before anyone asked them a question.</p><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> charmed a guard into stopping at her cell and then into gossiping. He admitted the detail had been running silent for days with no rotations and that command was cagey even with its own people, and he let slip the name of the next job, \"the <em>Rennick</em> run\", once \"this lot's processed\". <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> found no weakness in his cell, but did find a reason to crouch out of the camera's view beside a floor grate that rang oddly hollow.</p><h2>The Debrief</h2><p>Guards walked all three into a bare room to face <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>, who wanted their account of Vannix.</p><p>They blamed <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a>. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> was not convinced: his recovery teams had found no matching bodies, which meant the pair were either loose or the story was thinner than it looked. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> then gave a clean account of moving to eliminate <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> as a loose end and <a class=\"wl\" href=\"#sera\">Sera</a> stopping her, which fitted what he knew of <a class=\"wl\" href=\"#sera\">Sera</a>, and he let it stand.</p><p>When he asked about <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>, <a class=\"wl\" href=\"#rusk\">Rusk</a> and the <a class=\"wl\" href=\"#vannix-evidence\">evidence</a>, <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> tried \"Who's Telsa?\". <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> answered with his own recovery logs and a partial voiceprint naming all three of them, and marked the lie against them. Pressed again, the crew said nothing. He read the silence as confirmation that the evidence survived, rested two fingers on his collar-control cylinder without using it, and said the matter would be revisited \"later, and less politely\".</p><p>He asked whether they knew where they were. They gave him nothing, and he moved on.</p><p>Then he gave them Mission 02: kill <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>, garrison commander of <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>, and make it look like an accident, a rebel strike or a hunting mishap. <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> had refused a reprisal massacre after a rebel ambush killed his soldiers, and hunted the actual cell himself instead. Command considers that restraint ideological contagion — proof that fear isn't needed to hold a world — and wants him erased before the example spreads. The order was not negotiable.</p><h2>Redfall</h2><p>The crew landed at <a class=\"wl\" href=\"#redfall-station\">Redfall</a> under cover as an independent surveying, game and timber outfit: <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> as its face, <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> as camp boss and <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> as pilot and logistics. A bored customs officer waved a scanner over their <a class=\"wl\" href=\"#forged-permits\">forged permits</a>. Nearby, two off-duty soldiers shared a thermos and a joke, more relaxed than garrison troops on an occupied world have any right to be.</p><p>The <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> was warm, loud and unafraid. Troopers drank with loggers, a card game ran hot in the corner, and <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> held court at the longest table, buying rounds and plainly loved. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s round at the bar earned nothing but a reason to linger. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> did better: the bartender told him the town isn't happy, exactly, but isn't grieving either, and that the peace has a name on it — a commander who \"actually looks at what's in front of him 'stead of just following the book\".</p><h2>The Sweep</h2><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> went to work on <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> and had him charmed — right up until an Imperial ID sweep came in and flagged her permits as inconsistent with the spaceport manifest. An <a class=\"wl\" href=\"#id-sweep-officers\">officer</a> took her by the arm, and <a class=\"wl\" href=\"#bant-corrl\">Corrl</a>'s warmth went cold.</p><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>, three drinks in, staggered into the officer just as he reached for his comlink and bought a few seconds of confusion. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>, trying to eavesdrop, was caught at it, and a second officer fixed his attention on him and kept it there.</p><p>The session ended with <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> in custody's grip, <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> marked, and <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> watching in silence.</p>", "backlinks": ["overview"], "search": "session 2 — the rennick run custody, the debrief, new orders, and a cover identity tested on its first night."}, {"id": "session-1", "title": "Session 1 — No Survivors on Vannix Station", "group": "Sessions", "type": "doc", "typeLabel": "Session", "layout": "prose", "dek": "Mission 01, start to finish: the crash, the evidence, the collars, and the capture.", "conf": "", "confLabel": "", "player": "", "aliases": [], "aka": [], "html": "<h2>Before Vannix</h2><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> began in Imperial custody at <a class=\"wl\" href=\"#annex-17\">Annex 17</a>. A failed escape attempt and a vicious fight in the Cage Market against <a class=\"wl\" href=\"#kalax\">Kalax</a> and his two associates got them marked as dangerous prospects rather than ordinary prisoners. There they met the broker <a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a>, and <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> kept a stolen <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a> hidden on her person throughout.</p><p><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>, a Duros pilot with an old grievance against <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>, was bound into the same fate. All three were collared, interrogated and handed to <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>, an <a class=\"wl\" href=\"#isb\">ISB</a> officer assembling deniable convict assets for filthy work.</p><p>Their first assignment: infiltrate <a class=\"wl\" href=\"#vannix-station\">Vannix Relay Station</a>, recover its central data core, erase its records, stage a pirate attack, and leave no witnesses alive. <a class=\"wl\" href=\"#kalax\">Kalax</a> and his two associates were sent in as a competing team.</p><h2>Collision Course</h2><p><a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>'s insertion plan was brutally literal. The prisoners woke aboard the unmanned freighter <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a>, locked on a collision course with the station's docking arm. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> wrestled the approach into a more survivable maintenance collar, but the impact left him and <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> badly hurt. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> forced his way through the ruptured wreck and sealed the pressure breach.</p><h2>The Fight in the Wreck</h2><p>Then <a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew — <a class=\"wl\" href=\"#kalax\">Kalax</a>, <a class=\"wl\" href=\"#sera\">Sera</a> and a Nikto gunman — went for their weapons. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> took the fight out of the Nikto. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> shook off the crash, got his hands on a sidearm and wounded <a class=\"wl\" href=\"#kalax\">Kalax</a>. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> destroyed <a class=\"wl\" href=\"#sera\">Sera</a>'s improvised melee weapon, then threw a frag grenade that killed <a class=\"wl\" href=\"#cautious-nikto\">the Nikto</a> and wrecked some of the false-flag staging material with him. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> took his pirate pistol.</p><p>The freighter's damaged transponder had already shaken hands with the station's systems. Security was on its way, and fire and suppression foam were eating what was left of the wreck.</p><p><a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> broke off and escaped through a maintenance conduit the grenade had opened up. The crew grabbed what mission gear they could and followed. At a sealed service iris, <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> tried to strike a deal with the pair. It failed: they went through, sealed it behind them, and left the crew's escape route exposed to the security teams coming up behind. The crew dropped into a downward utility crawlway with station forces closing in.</p><h2>The Evidence</h2><p>The crew went for communications before the archives. In <a class=\"wl\" href=\"#communications-control\">Communications Control</a> they found <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> and a battered astromech called <a class=\"wl\" href=\"#rusk\">Rusk</a>, trying to get proof of an Imperial massacre off the station. The crew froze the transmission at 91%, but <a class=\"wl\" href=\"#rusk\">Rusk</a> kept the cleanest copy. A security-droid response forced everyone onto an emergency route, and <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> became the crew's guide — they were her best chance of keeping the <a class=\"wl\" href=\"#vannix-evidence\">evidence</a> alive.</p><h2>The Alcove</h2><p>In a side alcove, patching wounds, the crew made her talk. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> opened with an insult. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s quieter question — what were you trying to do with it? — is what got an answer.</p><p><em>\"Cresh Spike is the restraint system. Collars, implants, remote compliance hardware. Batch-linked. Military prison stock, ISB-modified. It can stun you, drop you, track you, maybe kill you if the calibration is cruel enough.\"</em></p><p>The archive held maintenance windows, authentication keys and collar-cart batch-sync data: enough to prove that prisoners were being used as disposable, deniable assets. Station Chief <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a> had authorised getting it off-station after the killings started, and his aide had already contacted a Rebel relay cell. <a class=\"wl\" href=\"#rusk\">Rusk</a> carried the clean copy — \"the one they didn't touch\".</p><p><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> asked whether she could get the collars off. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> reframed it: the crew would keep <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> and <a class=\"wl\" href=\"#rusk\">Rusk</a> alive, but not while <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> could drop them with a button. <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> tried a single diagnostic on <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s collar. It went badly — the collar threw a blue-white arc and convulsed him into the wall — but she learned something. The collars are batch-synced to a command node. With a calibration station, or a live technician console and officer-level keys, they might be able to spoof a maintenance cycle and perhaps disable the remote stun. <em>\"Maybe.\"</em></p><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> spent the last stimpack on himself, then tried to patch <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> while she flirted through the pain. <em>\"Buy me a drink first next time.\"</em> When the dressing wouldn't hold, he cobbled half-spent injectors and clotting accelerant into one improvised dose for her.</p><p><a class=\"wl\" href=\"#telsa-brie\">Telsa</a> named the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> as the place to try for the collars. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> caught her guessing harder than she admitted. <em>\"I'm not lying. I'm telling you where I'd look. That's different.\"</em> <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> ended the argument by producing her <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a> from her prison smock, and <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> dug out grey-blue station maintenance overalls for all three of them.</p><h2>The Core</h2><p><a class=\"wl\" href=\"#telsa-brie\">Telsa</a> led them up service ladders and a lift shaft, with <a class=\"wl\" href=\"#rusk\">Rusk</a> dragged along on a strip of insulation mat, until the passage opened above the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a>: a vertical data spine, three decks of catwalks, and blue light pulsing through the conduits. Below were <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, wounded and holding a holdout blaster, two station-security survivors watching the lower doors, a pair of utility droids and an idle security droid. From above, <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> couldn't find a clean first strike.</p><p>It turned violent when <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> took <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> hostage. <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, both guards and the security droid went down, and a collapsing gantry buried the last guard and one of the doors. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> and <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> came out of it hurt and briefly out cold.</p><p><a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> reappeared mid-fight and accepted a narrow ceasefire after <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> offered them a path toward collar freedom. <a class=\"wl\" href=\"#kalax\">Kalax</a> opened a relay panel under the core; the <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a> briefly identified all five collar-bearers, and <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> forced its lock into a false maintenance loop.</p><h2>Eleven Minutes</h2><p>Then the outer screen changed: Imperial assault shuttles on docking approach, minutes out. <em>\"They are coming for you,\"</em> <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> said. <em>\"And when they find me here, they will know exactly what I did.\"</em></p><p><a class=\"wl\" href=\"#kalax\">Kalax</a>, cutter whining, wanted to follow orders — no witnesses. <a class=\"wl\" href=\"#sera\">Sera</a> pointed out that <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> had kept the loop alive through the fighting when she could have sold them all out. <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> didn't plead. She could hide them in maintenance traffic, get the wounded out, and send the <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a> to the wrong section of the station — <em>\"But I will not walk willingly into a prison ship.\"</em></p><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> told her to do it and redirect the gunship. Then she caught <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s and <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a>'s eyes, drew a finger across her own throat, and drifted in behind the Mirialan with her blaster low.</p><p><a class=\"wl\" href=\"#sera\">Sera</a> saw it. Her weapon came up — at <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>. <em>\"Don't.\"</em> <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> spun, understood everything, and froze with the redirect half-finished. <em>\"I have eleven minutes. You shoot me, the loop dies, and that gunship comes straight back to this room.\"</em></p><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> turned to <a class=\"wl\" href=\"#kalax\">Kalax</a> and told him to put a muzzle on his partner. For half a second it almost worked. Then <a class=\"wl\" href=\"#sera\">Sera</a> stared her down, and <a class=\"wl\" href=\"#kalax\">Kalax</a> stepped back. <em>\"You want the witness dead, smuggler? You wear it. Not me. Not her.\"</em> The truce had hardened against <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>. At the terminal, <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>'s hands had come off the keys, and an amber line crawled across the display: <strong>BLACK WARRANT — VECTOR RECALCULATION DETECTED.</strong></p><p>How that standoff ended was never played out. The crew got clear of the core with the evidence, and what became of <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>, <a class=\"wl\" href=\"#rusk\">Rusk</a>, <a class=\"wl\" href=\"#arden-vel\">Arden Vel</a>, <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> is still unknown.</p><h2>Which Way Out</h2><p>On the run, the crew stopped long enough to argue a route. <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> knew how dirty crews slip a lockdown: stations like this keep an unregistered service berth for contractors who don't want to be on the manifest — <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>, low deck, aft, near the reclamation plant, with no transponder logging and an older docking-clamp control that doesn't answer to the central lockdown. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> argued Imperial doctrine and the escape pods, confidently and possibly wrongly. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> remembered that refit yards of this pattern have a central spine elevator running straight down to the docking ring.</p><p>They took the spine. The refit crews had welded off the passenger car but left the freight platform: a slab of durasteel grating in a shaft full of coolant machinery. It worked. It just wasn't built to hide anyone.</p><h2>The Drop</h2><p>Four decks down, the platform stopped by itself above an Imperial checkpoint slotted into the shaft: two stormtroopers and a scan-tech in Imperial black running a collar sweep. <em>\"...five signatures tagged off the Warrant. Grid says they're moving.\"</em> Sealing doors were closing overhead.</p><p><a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> forced the manual brake release with a shriek of metal, and the platform came down on the checkpoint. The scan-tech and one trooper died outright; <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> executed the second, pinned in the wreckage. The shriek brought a squad up behind them and triggered a lockdown bulkhead ahead.</p><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> forced the override with her <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a>, <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> shielded <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> and returned fire, and <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> spent his last stun grenade covering the retreat. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> held the doorway until all three were through, then sealed it on the squad. A dash down a service corridor, a ladder, and a corroded hatch that <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> forced open loudly brought them into a cargo bay within sight of <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>.</p><h2>Capture</h2><p>At the threshold, the <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> final response fired across all five collars at once — no local trace, no console, no gunship required. The three dropped where they stood, joints locked, as Imperial personnel closed in from three directions. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>'s voice came over a bulkhead speaker: <em>\"Cute. Sit tight.\"</em></p><p>Mission 01 ended in capture. 5 XP each.</p>", "backlinks": ["cassian-vorn", "overview"], "search": "session 1 — no survivors on vannix station mission 01, start to finish: the crash, the evidence, the collars, and the capture."}, {"id": "eleena-daru", "title": "Eleena Daru", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Twi'lek confidence artist. Reads what you want before you know you've shown it.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A blue-skinned Twi'lek smuggler and scoundrel, sentenced for trying to rob \"the wrong rich Imperial\". She survives on charm, misdirection and emotional leverage, and she is the crew's strongest liar and negotiator by some distance. Playful, predatory and adaptive, and at her most dangerous when she seems least so.</p><h2>History</h2><ul><li>Began in custody at <a class=\"wl\" href=\"#annex-17\">Annex 17</a> alongside <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>. A failed escape and a Cage Market fight against <a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew got her marked as a dangerous prospect.</li><li>Kept a stolen, matte-black Imperial <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a> hidden on her person from the start. <a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a> knows it exists.</li><li>Once smoke-bombed <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> and left him to face armed trouble alone. He remembers.</li><li>Made enemies of <a class=\"wl\" href=\"#kalax\">Kalax</a> and especially <a class=\"wl\" href=\"#sera\">Sera</a> on <a class=\"wl\" href=\"#vannix-station\">Vannix</a>.</li></ul><h2>On Vannix</h2><p>Badly hurt in the crash of the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a>. In the fight in the wreck she destroyed <a class=\"wl\" href=\"#sera\">Sera</a>'s improvised weapon and killed <a class=\"wl\" href=\"#cautious-nikto\">the Nikto</a> with a frag grenade. She tried to bargain with <a class=\"wl\" href=\"#kalax\">Kalax</a> and <a class=\"wl\" href=\"#sera\">Sera</a> at a sealed service iris and got locked out for it.</p><p>She got <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> talking with a clumsy insult followed by a smooth reframe, flirted with <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> through her own field dressing, and revealed her <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a> to get the crew into the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a>. There she took <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> hostage, bought a ceasefire with the promise of collar freedom, and then moved to execute <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> — which turned <a class=\"wl\" href=\"#sera\">Sera</a>'s gun on her. Her attempt to turn <a class=\"wl\" href=\"#kalax\">Kalax</a> against his partner failed badly.</p><p>Her underworld instincts found the way out: <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>, a bribe berth off the manifest. She executed a pinned checkpoint trooper during the drop, and forced the lockdown bulkhead with her <a class=\"wl\" href=\"#code-cylinder\">code cylinder</a>. At the debrief she told <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> the truth about <a class=\"wl\" href=\"#telsa-brie\">Telsa</a>, and it served her better than <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s lie served him.</p><h2>On Cathal's Reach</h2><p>The face of the surveying outfit at <a class=\"wl\" href=\"#redfall-station\">Redfall</a>. Had <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> charmed until the ID sweep flagged her <a class=\"wl\" href=\"#forged-permits\">forged permits</a>. In the brawl she was stunned point-blank, played the damsel well enough to win a sympathiser, and spent a desperate gamble trying to win <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> back. It failed.</p><p><a class=\"wl\" href=\"#ilse-wove\">Wove</a> has come to the <a class=\"wl\" href=\"#loggers-house\">logger's house</a> asking for her by name.</p>", "backlinks": ["bay-nine", "timeline", "ilse-wove", "elo-kesh", "kalax", "kenno-thorn", "bant-corrl", "threads", "annex-17", "sera", "session-1", "session-2", "session-3", "telsa-brie", "cautious-nikto", "central-computer-core", "code-cylinder", "overview", "forged-permits", "id-sweep-officers", "loggers-house", "vesh-talorr"], "search": "eleena daru twi'lek confidence artist. reads what you want before you know you've shown it."}, {"id": "kenno-thorn", "title": "Kennaud \"Kenno\" Thorn", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Disgraced Imperial veteran. Controls space, absorbs punishment, trusts no chain of command.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Kenneaud Thorn", "Kenneaud"], "aka": ["Kennaud Thorn"], "html": "<p>A human hired gun and mercenary soldier who knows Imperial procedure from the inside. He was sentenced after the fallout of an unlawful battlefield order, and for assaulting the officer who tried to make him carry the blame for it. Blunt, direct, violent when required, and deeply suspicious of any command that wants him to be disposable.</p><h2>History</h2><ul><li>Served with <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> years ago, before his fall. <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> was the officer he measured \"doing it right\" against.</li><li>Began in custody at <a class=\"wl\" href=\"#annex-17\">Annex 17</a> with <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>, where a failed escape and a Cage Market fight against <a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew got them both marked as dangerous.</li><li>His full name is something he keeps close. <a class=\"wl\" href=\"#elo-kesh\">Elo Kesh</a> knew it, which he did not expect.</li><li>Studied his <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collar during the fitting: a magnetic latch, a receiver node at the nape, and a recessed technician's service port.</li><li>Made an enemy of <a class=\"wl\" href=\"#kalax\">Kalax</a>.</li></ul><h2>On Vannix</h2><p>Forced his way through the ruptured <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a> and sealed the pressure breach, then took the fight out of <a class=\"wl\" href=\"#cautious-nikto\">the Nikto</a> and kept his pirate pistol afterwards. In the alcove he spent the last stimpack on himself, patched <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> (\"Buy me a drink first next time\"), and built her an improvised stim from scraps. He was the one who noticed <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> guessing harder than she admitted.</p><p>He argued Imperial doctrine and the escape pods when the crew planned their exit. They took the spine instead. He shielded <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> through the checkpoint fight and held the bulkhead doorway under fire until everyone was through, then sealed it. At the debrief he tried \"Who's Telsa?\" on <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>, who answered with a voiceprint.</p><h2>On Cathal's Reach</h2><p>Camp boss and muscle for the surveying outfit. Three drinks into a failed charm offensive at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>, he turned a stagger into cover for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>. When it broke, he killed the second <a class=\"wl\" href=\"#id-sweep-officers\">sweep officer</a> with a three-shot burst, and afterwards carried <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> out on his back.</p><p>He has not met <a class=\"wl\" href=\"#doran-rennick\">Rennick</a> yet.</p>", "backlinks": ["timeline", "doran-rennick", "cresh-spike", "eleena-daru", "elo-kesh", "kalax", "cassian-vorn", "marn-oshel", "bant-corrl", "mournful-credit", "threads", "annex-17", "session-1", "session-2", "session-3", "telsa-brie", "cautious-nikto", "overview", "forged-permits", "id-sweep-officers", "redfall-cantina", "vesh-talorr"], "search": "kennaud \"kenno\" thorn kennaud thorn kenneaud thorn kenneaud disgraced imperial veteran. controls space, absorbs punishment, trusts no chain of command."}, {"id": "vesh-talorr", "title": "Vesh Talorr", "group": "Player Characters", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Duros starfighter pilot with a legend to build and no ship to build it in.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Corellian-born Duros pilot contracted to <a class=\"wl\" href=\"#kordyne\">Kordyne</a>. Calm in the cockpit, precise under pressure, and ambitious enough to treat every engagement as another line in the legend he means to have. His signature fighter, the <a class=\"wl\" href=\"#sure-thing\">Sure Thing</a>, is long gone — reassigned or impounded by <a class=\"wl\" href=\"#kordyne\">Kordyne</a> well before any of this, and still a sore point.</p><h2>History</h2><ul><li>Bound into the collar programme alongside <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>, carrying an old grievance against <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> for a previous betrayal.</li><li><a class=\"wl\" href=\"#kordyne\">Kordyne</a> holds his contract debt.</li><li>Spotted a batch-synchronisation window in how the <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars are handled — a possible weakness in the procedure.</li></ul><h2>On Vannix</h2><p>Wrestled the unmanned <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a> off its collision course and into a survivable maintenance collar, and was badly hurt doing it. Shook off the crash, grabbed a sidearm and wounded <a class=\"wl\" href=\"#kalax\">Kalax</a>.</p><p>He asked <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> the question that got her talking, and then asked her to get the collars off. Her diagnostic on his collar threw him into a wall. His memory of refit-yard design sent the crew down the spine elevator. He forced the freight platform's manual brake to bring it down on the checkpoint, spent his last stun grenade covering the retreat, and forced the corroded hatch that led toward <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>. In custody he felt the floor lean when no floor should.</p><h2>On Cathal's Reach</h2><p>Pilot and logistics for the surveying outfit. Got the bartender at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> talking about <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>, then got caught eavesdropping. In the brawl he dropped the first <a class=\"wl\" href=\"#id-sweep-officers\">sweep officer</a> and covered the escape with suppressing fire, until <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> shot him twice in the doorway.</p><p>He is recovering at the <a class=\"wl\" href=\"#loggers-house\">logger's house</a> with an untreated wound, not fit to fight.</p>", "backlinks": ["timeline", "doran-rennick", "cresh-spike", "eleena-daru", "kalax", "kenno-thorn", "kordyne", "bant-corrl", "mournful-credit", "threads", "annex-17", "session-1", "session-2", "session-3", "sure-thing", "telsa-brie", "detention-vessel", "overview", "forged-permits", "id-sweep-officers", "loggers-house", "redfall-cantina"], "search": "vesh talorr duros starfighter pilot with a legend to build and no ship to build it in."}, {"id": "cassian-vorn", "title": "Major Cassian Vorn", "group": "Handlers", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The handler. ISB. Holds the collars, the orders, and the grudge.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>An <a class=\"wl\" href=\"#isb\">ISB</a> officer assembling deniable convict assets for filthy work, and the man who runs the crew. Controlled, clipped and deniable, he holds authority over their <a class=\"wl\" href=\"#cresh-spike\">Cresh Spike</a> collars — including the final response that ended <a class=\"wl\" href=\"#session-1\">Mission 01</a> — and hands out missions that are not up for discussion.</p><p>His idea of an insertion is literal. He put the crew aboard the unmanned <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a> and aimed it at <a class=\"wl\" href=\"#vannix-station\">Vannix</a> to bury a massacre under a pirate story, with <a class=\"wl\" href=\"#kalax\">Kalax</a>'s crew along as competition. When the collars dropped them short of <a class=\"wl\" href=\"#bay-nine\">Bay Nine</a>, it was his voice on the bulkhead speaker: <em>\"Cute. Sit tight.\"</em></p><h2>The Debrief</h2><p>He took their account of Vannix without taking it at face value. He caught <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s lie about <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> with recovery logs and a voiceprint, and read the crew's silence as confirmation that the <a class=\"wl\" href=\"#vannix-evidence\">The Vannix Evidence</a> survived. He did not press — he rested two fingers on his collar-control cylinder and said it would be revisited \"later, and less politely\".</p><p>He also asked whether they knew where they were. They didn't answer.</p><h2>Mission 02</h2><p>Ordered the death of <a class=\"wl\" href=\"#doran-rennick\">Rennick</a>, to look like an accident, a rebel strike or a hunting mishap. The crew have not heard from him since arriving on <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>, but expect to.</p><h2>From Vorn's Files</h2><div class=\"panel note\"><div class=\"ph\">Shared with the table — the crew haven't seen these</div><p>During Mission 01, Vorn's deployment report and private notes were posted for the players. His read on the crew: \"Daru would lie before she killed. Thorn would kill before he hesitated. Talorr would look for the system behind the room.\" And later: \"Thorn remains the stabilising violence. Daru remains the breach risk. Talorr may be the asset who actually understands the battlefield.\" On the Nikto: \"Loss of the Nikto is acceptable.\" His standing recommendation: maintain collar readiness, don't intervene unless capture, defection or premature death threatens the objective — \"Let Vannix continue the evaluation.\"</p></div>", "backlinks": ["timeline", "doran-rennick", "cresh-spike", "eleena-daru", "kalax", "kenno-thorn", "mournful-credit", "threads", "annex-17", "rusk", "sera", "lysa-venn", "session-1", "session-2", "telsa-brie", "cautious-nikto", "detention-vessel", "overview", "penal-program", "isb", "vannix-evidence"], "search": "major cassian vorn the handler. isb. holds the collars, the orders, and the grudge."}, {"id": "ilse-wove", "title": "Captain Ilse Wove", "group": "Cathal's Reach", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Rennick's second. Watchful, blunt, and standing at the door.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p><a class=\"wl\" href=\"#doran-rennick\">Rennick</a>'s second-in-command on <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>: watchful, blunt and unimpressed by outsiders.</p><p>The morning after the brawl at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>, she came to the <a class=\"wl\" href=\"#loggers-house\">logger's house</a> in person with two troopers, introduced herself as garrison liaison, and asked to speak to <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> — by name, and alone. News of the brawl had plainly reached her overnight.</p><p>She has not drawn a weapon or made a threat. She stands with her hands clasped and lets what she might know do the work. How much she actually knows, and how much she is fishing for, is the question the crew have to answer before they open the door.</p>", "backlinks": ["timeline", "doran-rennick", "eleena-daru", "threads", "session-3", "cathals-reach-garrison", "overview", "loggers-house"], "search": "captain ilse wove rennick's second. watchful, blunt, and standing at the door."}, {"id": "doran-rennick", "title": "Colonel Doran Rennick", "group": "Cathal's Reach", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The target. Refused to massacre a town, and Command wants him dead for it.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>Imperial Army garrison commander of <a class=\"wl\" href=\"#cathals-reach\">Cathal's Reach</a>, and the man <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> has ordered the crew to kill.</p><h2>Why He's a Target</h2><p>After a rebel ambush killed several of his soldiers, Rennick was expected to carry out a doctrinal reprisal against the local population. He refused. He hunted down the cell responsible himself and left the town standing. His garrison has been unusually loyal and slow to desert ever since.</p><p>Command reads that as ideological contagion: living proof that fear isn't needed to hold a world. It wants him quietly erased before the idea spreads — by an accident, a rebel strike or a hunting mishap, nothing traceable.</p><h2>What the Crew Have Heard</h2><p>The bartender at the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> told <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> that the town's peace has Rennick's name on it — a commander who \"actually looks at what's in front of him 'stead of just following the book\". Before that, a guard in custody let slip that the crew's next job was \"the <em>Rennick</em> run\".</p><h2>Kenno</h2><p><a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> served with him years ago, before his own fall. Rennick was the officer Kenno measured \"doing it right\" against. They have not met again yet, and whether Rennick will recognise him is an open question.</p><p>His second is <a class=\"wl\" href=\"#ilse-wove\">Wove</a>.</p>", "backlinks": ["timeline", "ilse-wove", "cathals-reach", "kenno-thorn", "cassian-vorn", "threads", "session-2", "session-3", "cathals-reach-garrison", "overview", "redfall-cantina", "vesh-talorr"], "search": "colonel doran rennick the target. refused to massacre a town, and command wants him dead for it."}, {"id": "marn-oshel", "title": "Marn Oshel", "group": "Cathal's Reach", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "A backcountry local who wasn't fooled.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A weathered backcountry local who was briefly there the night the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> broke. He remarked flatly that the crew \"doesn't fight like surveyors\", and walked off into the dark. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> tried to draw him into conversation and got nothing.</p><p>What he wants, and who he might tell, is unknown.</p>", "backlinks": ["session-3"], "search": "marn oshel a backcountry local who wasn't fooled."}, {"id": "bant-corrl", "title": "Master Sergeant Bant Corrl", "group": "Cathal's Reach", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "The garrison's heart. Bought the rounds, then shot Vesh.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>Senior NCO of the <a class=\"wl\" href=\"#cathals-reach-garrison\">Cathal's Reach garrison</a>. Warm, loud and generous, he runs the culture of the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a> and seems to know every trooper by name. The crew's first sight of him was at the head of the longest table, buying rounds, loved rather than merely obeyed.</p><p><a class=\"wl\" href=\"#eleena-daru\">Eleena</a> had him charmed until the ID sweep came in. The moment uniforms were involved, his warmth went cold, and he held back from the fight until <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> killed the second <a class=\"wl\" href=\"#id-sweep-officers\">sweep officer</a> in front of him. Then he committed against the crew, and <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s attempt to win him back failed.</p><p>He shot <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> twice in the doorway, the second shot leaving a serious wound. When the constabulary arrived he held the scene rather than give chase.</p><p>He is now a hostile eyewitness with every reason to name the crew. Whatever he felt for <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> is probably gone for good.</p>", "backlinks": ["timeline", "eleena-daru", "threads", "session-2", "session-3", "cathals-reach-garrison", "id-sweep-officers", "redfall-cantina", "vesh-talorr"], "search": "master sergeant bant corrl the garrison's heart. bought the rounds, then shot vesh."}, {"id": "id-sweep-officers", "title": "The ID-Sweep Officers", "group": "Cathal's Reach", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Two Imperial officers who checked the wrong permits. Both dead.", "conf": "mid", "confLabel": "Needs review", "player": "", "aliases": [], "aka": [], "html": "<p>Two unnamed Imperial officers running an identity sweep through the <a class=\"wl\" href=\"#redfall-cantina\">Redfall cantina</a>.</p><p>The first flagged <a class=\"wl\" href=\"#eleena-daru\">Eleena</a>'s <a class=\"wl\" href=\"#forged-permits\">forged permits</a> as inconsistent with the spaceport manifest and took her by the arm. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a>'s drunken stagger knocked him off his comlink before he could call for backup. When he tried to drag her out, the cantina erupted. He shot <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> on stun, <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> dropped him, and the crew took a binder-release key and a spare charge pack off him. He did not survive the night's fighting.</p><p>The second caught <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> eavesdropping and never took his eyes off him again. <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> killed him with a three-shot burst, which is what turned <a class=\"wl\" href=\"#bant-corrl\">Corrl</a> against the crew.</p>", "backlinks": ["timeline", "kenno-thorn", "bant-corrl", "session-2", "session-3", "redfall-cantina", "vesh-talorr"], "search": "the id-sweep officers two imperial officers who checked the wrong permits. both dead."}, {"id": "galdrek-voss", "title": "Galdrek Voss", "group": "Vannix", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "A Weequay pirate prisoner, staged for the false flag.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": [], "aka": [], "html": "<p>A Weequay pirate prisoner staged as part of the false-flag raid on <a class=\"wl\" href=\"#vannix-station\">Vannix</a>: a real pirate to make the fake pirate story hold together.</p><p>He has no part in the current arc.</p>", "backlinks": [], "search": "galdrek voss a weequay pirate prisoner, staged for the false flag."}, {"id": "kalax", "title": "Kalax", "group": "Vannix", "type": "character", "typeLabel": "Character", "layout": "prose", "dek": "Rival prisoner, brief ally, convenient scapegoat.", "conf": "hi", "confLabel": "Confirmed", "player": "", "aliases": ["Kallax"], "aka": [], "html": "<p>A fellow prisoner and a rival from the start. He and his two associates, <a class=\"wl\" href=\"#sera\">Sera</a> and a Nikto gunman, fought <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> and <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> in the Cage Market at <a class=\"wl\" href=\"#annex-17\">Annex 17</a>, and <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a> sent all three into <a class=\"wl\" href=\"#vannix-station\">Vannix</a> as a competing team.</p><p>They went for weapons in the wreck of the <a class=\"wl\" href=\"#mournful-credit\">Mournful Credit</a>. <a class=\"wl\" href=\"#vesh-talorr\">Vesh</a> wounded Kalax and <a class=\"wl\" href=\"#cautious-nikto\">the Nikto</a> died, and Kalax and <a class=\"wl\" href=\"#sera\">Sera</a> slipped away through a maintenance conduit. When <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> tried to strike a deal at a sealed service iris, they went through it, sealed it, and left the crew exposed.</p><p>They reappeared in the <a class=\"wl\" href=\"#central-computer-core\">Central Computer Core</a> and took a ceasefire when <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> offered them a path toward collar freedom. Kalax opened the relay panel that let <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> loop the <a class=\"wl\" href=\"#black-warrant\">Black Warrant</a>'s trace. With a plasma cutter in hand, he wanted <a class=\"wl\" href=\"#telsa-brie\">Telsa</a> dead on Vorn's orders — but when <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> tried to make him turn on <a class=\"wl\" href=\"#sera\">Sera</a>, he stepped back. <em>\"You want the witness dead, smuggler? You wear it. Not me. Not her.\"</em> He counts <a class=\"wl\" href=\"#kenno-thorn\">Kenno</a> and <a class=\"wl\" href=\"#eleena-daru\">Eleena</a> as enemies.</p><p>At the debrief the crew blamed him for the mission's failures. <a class=\"wl\" href=\"#cassian-vorn\">Vorn</a>'s people found no body. His fate is unconfirmed.</p>", "backlinks": ["timeline", "eleena-daru", "kenno-thorn", "sera-korr", "cassian-vorn", "mournful-credit", "threads", "annex-17", "sera", "session-1", "session-2", "cautious-nikto", "central-computer-core", "overview", "penal-program", "vesh-talorr"], "search": "kalax kallax rival prisoner, brief ally, convenient scapegoat."}, {"id": "sera-korr", "title": "Lieutenant Sera Korr", "group": "Vannix", "type": "characte
